<!-- LA PORTA D'INGRESSO — e perché è solo una porta (punto 27).

     Le pagine del gioco stanno tutte in `pagine/`: la landing, l'accesso e la
     partita. Questo file resta qui perché è l'indirizzo che conoscono tutti —
     `frontend/` aperta col doppio clic, `npm run dev`, Electron, Capacitor,
     un server web che serve la cartella — e da qui manda alla landing.

     Il rimando è scritto due volte apposta: il `meta refresh` funziona anche
     se il JavaScript è spento o non parte, il `location.replace` fa la stessa
     cosa subito e **senza lasciare traccia nella cronologia**, così il tasto
     «indietro» del browser non riporta qui dentro in un giro infinito.

     La schermata qui sotto è quella d'avvio, copiata da css/servizio.css: non
     si carica un foglio di stile per un rimando che dura un battito, ma un
     lampo bianco in faccia non lo merita nessuno. -->

<link rel="canonical" href="pagine/landing.html">
<style>
  html,body{height:100%}
  body{margin:0;background:#0B0B0D;color:#F5F3EF;display:grid;place-items:center;
    font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
  .porta{display:grid;gap:14px;justify-items:center;padding:24px}

  .porta h1{font-size:26px;font-weight:900;margin:0;letter-spacing:-.02em}
  .porta h1 em{font-style:normal;color:#FF5A36}
  .porta p{margin:0;font-size:14px;color:rgba(245,243,239,.6)}
  .porta a{color:rgba(245,243,239,.85)}
</style>
</head>
