<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anni di Fame — Creator · V84 Long Hair + Matte Fix</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"
  }
}
</script>
<style>
:root{
  --ink:#0d0d0f;
  --paper:#f1eadb;
  --muted:#bdb6a9;
  --line:rgba(255,255,255,.17);
  --gold:#d3aa5e;
  --wine:#8e3354;
  --sage:#71876e;
  --panel:rgba(10,10,12,.62);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#0b0b0d;color:var(--paper);font-family:Inter,Arial,sans-serif}
body{overflow:hidden}
button,input{font:inherit}
.stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:#0b0b0d;isolation:isolate}
.blur{position:absolute;inset:-3%;background:url(assets/room-00-5e3089bb6543.png) center/cover no-repeat;filter:blur(22px) brightness(.48) saturate(.82);transform:scale(1.04)}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;filter:saturate(.90) contrast(1.025);transform-origin:50% 43%;will-change:transform}
.blur{transform-origin:50% 43%;will-change:transform}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,7,9,.63) 0%,rgba(7,7,9,.12) 27%,rgba(7,7,9,.06) 66%,rgba(7,7,9,.70) 100%),linear-gradient(0deg,rgba(7,7,9,.42),transparent 42%,rgba(7,7,9,.18));pointer-events:none;z-index:2}
.stage::after{content:"";position:absolute;inset:0;z-index:11;opacity:.065;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.22) .65px,transparent .65px);background-size:4px 4px}
.viewer{position:absolute;left:50%;top:0;width:39%;height:100%;transform:translateX(-50%);z-index:3}
canvas{width:100%;height:100%;display:block}

/* Wordmark: stesso lessico tipografico del menu principale */
.brand{position:absolute;z-index:14;left:42px;top:31px;font-size:15px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:var(--paper);text-shadow:0 2px 18px rgba(0,0,0,.45)}
.brand::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin:0 12px 2px 0;background:var(--gold);box-shadow:0 0 0 4px rgba(211,170,94,.10)}
.brand::after{content:" · CREATOR";color:var(--gold)}
.status{position:absolute;z-index:14;right:42px;top:30px;text-align:right;color:#d2cbc0;font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:750}
.status b{display:block;color:var(--paper);margin-top:7px;font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:none}

/* View switcher derivato dal dock del menu */
.views{position:absolute;left:50%;top:79%;transform:translateX(-50%);z-index:15;display:flex;gap:6px;padding:7px;background:rgba(13,13,15,.66);border:1px solid rgba(255,255,255,.13);border-radius:22px;backdrop-filter:blur(22px);box-shadow:0 14px 50px rgba(0,0,0,.30)}
.views button{position:relative;min-width:82px;border:0;background:transparent;color:#aaa397;padding:11px 15px 12px;border-radius:15px;font-size:9px;font-weight:850;letter-spacing:.13em;text-transform:uppercase;cursor:pointer;transition:.2s background,.2s transform,.2s color}
.views button::after{content:"";position:absolute;left:14px;right:14px;bottom:6px;height:1px;background:rgba(255,255,255,.13);transform:scaleX(.25);transform-origin:left;transition:.22s transform,.22s background}
.views button:hover{background:rgba(255,255,255,.075);color:#fff;transform:translateY(-1px)}
.views button.on{background:rgba(211,170,94,.12);color:#f4d28e}
.views button.on::after,.views button:hover::after{transform:scaleX(1);background:var(--gold)}

/* Pannello creator: vetro scuro coerente col dock */
.panel{position:absolute;z-index:14;right:38px;top:94px;width:326px;padding:10px;background:rgba(13,13,15,.64);border:1px solid rgba(255,255,255,.13);border-radius:24px;backdrop-filter:blur(22px);box-shadow:0 14px 50px rgba(0,0,0,.34)}
.panel h2{position:relative;margin:0;padding:18px 20px 17px;border-radius:17px;background:rgba(255,255,255,.055);font-size:13px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:var(--paper)}
.panel h2::before{content:"01";display:block;margin-bottom:7px;font-size:9px;font-weight:800;letter-spacing:.18em;color:#a9a195}
.panel h2::after{content:"";position:absolute;left:18px;right:18px;bottom:10px;height:1px;background:var(--gold);opacity:.72;transform:scaleX(.20);transform-origin:left}
.group{margin:8px 0 0;padding:15px 18px 17px;border-radius:17px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.055);transition:.2s background,.2s border-color}
.group:hover{background:rgba(255,255,255,.045);border-color:rgba(255,255,255,.10)}
.group label{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#d2c9ba;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.16em;margin-bottom:12px}
.group label span{display:flex;align-items:center;gap:9px}
.group label span::before{content:"";width:17px;height:1px;background:var(--gold);opacity:.85}
.group label b{color:var(--paper);font-size:10px;letter-spacing:.06em;font-weight:850;text-transform:none}

.faces{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.faces button{position:relative;border:1px solid rgba(255,255,255,.11);background:rgba(8,8,10,.36);color:#c8c1b8;padding:11px 10px;border-radius:13px;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:.2s background,.2s border-color,.2s color,.2s transform}
.faces button:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.18);color:#fff;transform:translateY(-1px)}
.faces button.on{background:rgba(211,170,94,.13);border-color:rgba(211,170,94,.44);color:#f4d28e;box-shadow:inset 0 -1px 0 rgba(211,170,94,.42)}
.faces button.on::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--gold);margin-right:7px;vertical-align:1px}

/* Range completamente ridisegnati, stessa palette */
.group input[type=range]{width:100%;height:18px;margin:0;appearance:none;-webkit-appearance:none;background:transparent;cursor:pointer}
.group input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:999px;background:linear-gradient(90deg,rgba(211,170,94,.78),rgba(241,234,219,.28))}
.group input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;margin-top:-6.5px;border-radius:50%;background:var(--paper);border:4px solid #151517;box-shadow:0 0 0 1px rgba(211,170,94,.70),0 4px 12px rgba(0,0,0,.35)}
.group input[type=range]::-moz-range-track{height:2px;border:0;border-radius:999px;background:rgba(241,234,219,.28)}
.group input[type=range]::-moz-range-progress{height:2px;border-radius:999px;background:rgba(211,170,94,.78)}
.group input[type=range]::-moz-range-thumb{width:8px;height:8px;border-radius:50%;background:var(--paper);border:4px solid #151517;box-shadow:0 0 0 1px rgba(211,170,94,.70)}

.note{position:absolute;left:50%;bottom:17px;transform:translateX(-50%);z-index:14;padding:7px 11px;border:1px solid rgba(255,255,255,.09);border-radius:999px;background:rgba(13,13,15,.50);backdrop-filter:blur(14px);color:#9f988d;font-size:9px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;white-space:nowrap}

@media(max-width:1100px){
  .viewer{width:52%}
  .panel{right:14px;width:270px}
  .brand{left:22px;top:21px}
  .status{right:22px;top:21px}
}
@media(max-height:720px) and (min-width:901px){
  .panel{top:68px;transform:scale(.90);transform-origin:top right}
  .views{top:auto;bottom:54px;transform:translateX(-50%) scale(.92)}
  .brand{top:16px}
  .status{top:15px}
}


.panel-section{display:contents}
.panel-section:not(.active){display:none}
.face-shapes{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.face-shapes button{padding:9px 7px;font-size:8.8px}
.face-dual{gap:10px}
.mini-control{min-width:0}
.mini-control + .mini-control{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.065)}
.mini-control label{margin-bottom:6px}
.mini-control input[type=range]{height:14px}

.color-picks{grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.color-picks button,.brow-styles button{display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 6px;font-size:8.7px}
.brow-styles{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.dot{width:10px;height:10px;border-radius:999px;display:inline-block;flex:0 0 auto;box-shadow:0 0 0 1px rgba(255,255,255,.16) inset,0 0 0 1px rgba(0,0,0,.28)}
.native-color-picker{
  position:absolute;
  width:1px;height:1px;
  opacity:0;
  pointer-events:none;
}
.custom-color-btn .custom-dot{
  box-shadow:0 0 0 1px rgba(211,170,94,.42),0 0 0 1px rgba(0,0,0,.30) inset;
}
.custom-color-btn.on{
  border-color:rgba(211,170,94,.64);
}
button:disabled{opacity:.45;cursor:not-allowed}
input.disabled{opacity:.45}


/* ================= V67 · VOLTO A SOTTOSEZIONI ================= */
.face-subnav{
  grid-column:1 / -1;
  min-width:0;
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:6px;
  padding:5px;
  border-radius:15px;
  border:1px solid rgba(255,255,255,.07);
  background:rgba(255,255,255,.025);
}
.face-subnav button{
  position:relative;
  min-width:0;
  border:1px solid rgba(255,255,255,.09);
  background:rgba(8,8,10,.28);
  color:#aaa397;
  border-radius:11px;
  padding:8px 9px 9px;
  font:800 8.7px/1 Inter,Arial,sans-serif;
  letter-spacing:.11em;
  text-transform:uppercase;
  cursor:pointer;
  transition:.18s background,.18s border-color,.18s color,.18s transform;
}
.face-subnav button:hover{
  background:rgba(255,255,255,.065);
  border-color:rgba(255,255,255,.16);
  color:#fff;
  transform:translateY(-1px);
}
.face-subnav button.on{
  background:rgba(211,170,94,.12);
  border-color:rgba(211,170,94,.40);
  color:#f4d28e;
}
.face-tab-item{display:none !important}
.face-tab-item.on{display:flex !important}

/* Face panel stays shallow: subnav row + one row of controls. */
.panel:has([data-panel-section="face"].active){
  grid-template-columns:repeat(4,minmax(0,1fr));
  align-items:stretch;
}
.panel:has([data-panel-section="face"].active) .face-subnav{
  min-height:34px;
}
.panel:has([data-panel-section="face"].active) .group{
  min-height:92px;
}

@media(max-width:900px){
  .face-subnav{grid-template-columns:repeat(3,minmax(0,1fr))}
}


/* ================= V73 · CAPELLI TEXTURED ================= */
.panel:has([data-panel-section="hair"].active){
  grid-template-columns:repeat(4,minmax(0,1fr));
  align-items:stretch;
}
.panel:has([data-panel-section="hair"].active) .group{
  min-height:106px;
}
.hair-test-styles{
  grid-template-columns:repeat(3,minmax(0,1fr));
}
.panel:has([data-panel-section="hair"].active) .hair-style-group{min-height:180px}
.panel:has([data-panel-section="hair"].active){bottom:105px}
@media(max-width:900px){.hair-test-styles{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ================= V27 · NAVIGAZIONE IN BASSO ================= */
/* Il pannello laterale diventa un tray orizzontale. Nessuna logica 3D qui. */
.panel{
  left:50%; right:auto; top:auto; bottom:113px;
  transform:translateX(-50%);
  width:min(1100px,calc(100vw - 56px));
  padding:9px;
  display:grid;
  grid-template-columns:1.15fr 1fr 1fr 1fr;
  gap:8px;
  align-items:stretch;
  border-radius:24px;
  background:rgba(13,13,15,.67);
}
.panel h2{
  margin:0;
  min-height:96px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:18px 20px 17px;
}
.panel h2::before{content:"01 / EDIT";margin-bottom:8px}
.panel h2::after{bottom:13px;transform:scaleX(.34)}
.group{
  margin:0;
  min-width:0;
  padding:15px 18px 16px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.group label{margin-bottom:11px}
.faces{grid-template-columns:repeat(2,minmax(0,1fr))}
.faces button{padding:11px 10px;font-size:9.5px}

/* Due sole inquadrature utili: Volto e Intero. */
.views{
  left:auto; right:32px; top:auto; bottom:122px;
  transform:none;
  z-index:17;
  padding:6px;
  border-radius:18px;
}
.views button{min-width:78px;padding:12px 17px 13px;font-size:9.5px}

/* Dock principale derivato dal menu iniziale. */
.creator-nav{
  position:absolute;
  left:50%; bottom:24px;
  transform:translateX(-50%);
  z-index:18;
  width:min(1100px,calc(100vw - 56px));
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
  padding:7px;
  border:1px solid rgba(255,255,255,.13);
  border-radius:22px;
  background:rgba(13,13,15,.72);
  backdrop-filter:blur(22px);
  box-shadow:0 14px 50px rgba(0,0,0,.34);
}
.creator-nav button{
  position:relative;
  border:0;
  min-height:66px;
  padding:12px 17px 13px;
  border-radius:15px;
  background:transparent;
  color:#aaa397;
  text-align:left;
  cursor:pointer;
  transition:.2s background,.2s color,.2s transform;
}
.creator-nav button .num{
  display:block;
  margin-bottom:4px;
  font-size:9px;
  line-height:1;
  font-weight:850;
  letter-spacing:.18em;
  color:#817b72;
}
.creator-nav button .name{
  display:block;
  font-size:11px;
  font-weight:900;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.creator-nav button::after{
  content:"";
  position:absolute;
  left:14px; right:14px; bottom:7px;
  height:1px;
  background:rgba(255,255,255,.12);
  transform:scaleX(.18);
  transform-origin:left;
  transition:.22s transform,.22s background;
}
.creator-nav button:not(:disabled):hover{
  background:rgba(255,255,255,.065);
  color:#fff;
  transform:translateY(-1px);
}
.creator-nav button.active{
  background:rgba(211,170,94,.12);
  color:#f4d28e;
}
.creator-nav button.active .num{color:var(--gold)}
.creator-nav button.active::after,
.creator-nav button:not(:disabled):hover::after{
  transform:scaleX(1);
  background:var(--gold);
}
.creator-nav button:disabled{
  cursor:default;
  opacity:.42;
}
.creator-nav button:disabled .name::after{
  content:"  · presto";
  font-size:7px;
  font-weight:700;
  letter-spacing:.09em;
  color:#777168;
}

.note{
  left:28px; bottom:29px; transform:none;
  z-index:19;
  max-width:190px;
  overflow:hidden;
  text-overflow:ellipsis;
}

@media(max-width:1100px){
  .viewer{width:50%}
  .panel{
    left:50%;right:auto;bottom:110px;
    width:calc(100vw - 36px);
    grid-template-columns:1.1fr 1fr 1fr 1fr;
    transform:translateX(-50%);
  }
  .creator-nav{width:calc(100vw - 36px)}
  .views{right:19px;bottom:118px}
}
@media(max-width:820px){
  .panel{
    width:calc(100vw - 24px);
    grid-template-columns:repeat(2,1fr);
    bottom:95px;
    max-height:240px;
    overflow:auto;
  }
  .creator-nav{width:calc(100vw - 24px);overflow-x:auto;grid-template-columns:repeat(5,minmax(112px,1fr));bottom:14px}
  .views{right:12px;bottom:103px}
  .note{display:none}
}
@media(max-height:720px) and (min-width:901px){
  .panel{
    top:auto;right:auto;bottom:92px;
    transform:translateX(-50%) scale(.90);
    transform-origin:bottom center;
  }
  .views{top:auto;right:22px;bottom:98px;transform:scale(.90);transform-origin:bottom right}
  .creator-nav{bottom:14px;transform:translateX(-50%) scale(.94);transform-origin:bottom center}
}


.adf-local-actions{position:fixed;z-index:99999;right:18px;top:18px;display:flex;gap:9px}
.adf-local-actions button{border:1px solid rgba(255,255,255,.2);background:rgba(8,8,10,.78);color:#f1eadb;border-radius:999px;padding:10px 14px;font:700 11px/1 Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(9px)}
.adf-local-actions .ok{background:#f1eadb;color:#0d0d0f;border-color:#f1eadb}
</style>
</head>
<body>
<div class="stage">
  <div class="blur"></div>
  <img class="bg" src="assets/room-00-5e3089bb6543.png" alt="">
  <div class="shade"></div>

  <div class="brand">Anni di Fame</div>
  <div class="status">01 · Sesso + fisico<b id="status">caricamento corpo leggero…</b></div>

  <div class="viewer" id="viewer"></div>

  <div class="views">
    <button data-view="face">Volto</button>
    <button data-view="full" class="on">Intero</button>
  </div>

  <div class="panel">
    <div class="panel-section active" data-panel-section="body">
      <div class="group">
        <label><span>Sesso</span></label>
        <div class="faces">
          <button data-sex="male" class="on">Maschile</button>
          <button data-sex="female">Femminile</button>
        </div>
      </div>

      <div class="group">
        <label><span>Altezza</span><b id="hv">178 cm</b></label>
        <input id="height" type="range" min="155" max="205" value="178">
      </div>

      <div class="group">
        <label><span>Peso</span><b id="wv">72 kg</b></label>
        <input id="weight" type="range" min="45" max="140" value="72">
      </div>

      <div class="group">
        <label><span>Corporatura</span><b id="bv">media</b></label>
        <input id="build" type="range" min="-100" max="100" value="0">
      </div>
    </div>

    <div class="panel-section" data-panel-section="face">
      <div class="face-subnav" aria-label="Sottosezioni volto">
        <button type="button" class="on" data-face-subtab="structure">Struttura</button>
        <button type="button" data-face-subtab="nose">Naso</button>
        <button type="button" data-face-subtab="eyes">Occhi</button>
        <button type="button" data-face-subtab="brows">Sopracciglia</button>
        <button type="button" data-face-subtab="mouth">Bocca</button>
        <button type="button" data-face-subtab="chin">Mento / Orecchie</button>
      </div>
      <div class="group face-shape-group face-tab-item on" data-face-tab="structure">
        <label><span>Forma volto</span><b id="faceShapeLabel">base</b></label>
        <div class="faces face-shapes">
          <button data-face-shape="base" class="on">Base</button>
          <button data-face-shape="ovale">Ovale</button>
          <button data-face-shape="squadrato">Squadrato</button>
          <button data-face-shape="tondo">Tondo</button>
          <button data-face-shape="affilato">Affilato</button>
        </div>
      </div>

      <div class="group face-dual face-tab-item on" data-face-tab="structure">
        <div class="mini-control">
          <label><span>Linea mandibolare</span><b id="jawV">neutra</b></label>
          <input id="faceJaw" type="range" min="-100" max="100" value="0">
        </div>
        <div class="mini-control">
          <label><span>Prominenza zigomi</span><b id="cheekV">neutra</b></label>
          <input id="faceCheeks" type="range" min="0" max="100" value="0">
        </div>
      </div>

      <div class="group face-tab-item on" data-face-tab="structure">
        <label><span>Guance · volume</span><b id="cheekVolumeV">neutre</b></label>
        <input id="faceCheekVolume" type="range" min="-100" max="100" value="0">
      </div>

      <div class="group face-dual face-tab-item" data-face-tab="nose">
        <div class="mini-control">
          <label><span>Naso · larghezza</span><b id="noseWidthV">neutro</b></label>
          <input id="faceNoseWidth" type="range" min="-100" max="100" value="0">
        </div>
        <div class="mini-control">
          <label><span>Naso · lunghezza</span><b id="noseLengthV">neutro</b></label>
          <input id="faceNoseLength" type="range" min="-100" max="100" value="0">
        </div>
      </div>

      <div class="group face-dual face-tab-item" data-face-tab="nose">
        <div class="mini-control">
          <label><span>Naso · dimensione</span><b id="noseSizeV">neutra</b></label>
          <input id="faceNoseSize" type="range" min="-100" max="100" value="0">
        </div>
        <div class="mini-control">
          <label><span>Naso · punta</span><b id="noseTipV">neutra</b></label>
          <input id="faceNoseTip" type="range" min="-100" max="100" value="0">
        </div>
      </div>

      <div class="group face-dual face-tab-item" data-face-tab="nose">
        <div class="mini-control">
          <label><span>Naso · profilo</span><b id="noseProfileV">neutro</b></label>
          <input id="faceNoseProfile" type="range" min="-100" max="100" value="0">
        </div>
        <div class="mini-control">
          <label><span>Narici · larghezza</span><b id="nostrilsV">neutre</b></label>
          <input id="faceNostrils" type="range" min="-100" max="100" value="0">

function applyBodyScale(){
  if(!model) return;

  // Add width/depth compensation from weight so a tall character doesn't read as thin.
  const extraMass = 1 + currentWeightHeavy * 0.14 - currentWeightThin * 0.05;
  model.scale.set(currentHeightScale * extraMass, currentHeightScale, currentHeightScale * extraMass);
  model.updateMatrixWorld(true);
  rebox();

  applyEyeSpacing();
  applyEyebrowTransforms();
  fitSyntheticEyesToFace();

function setSignedMorphPair(negativeNames,positiveNames,value){
  const v=THREE.MathUtils.clamp(Number(value)||0,-100,100)/100;

function applyChinPointComposite(){
  // Combine the selected face-shape recipe, jawline refinement and the
  // dedicated chin-point slider without letting the controls erase each other.
  const shapeRecipe=FACE_SHAPES[currentFaceShape] || FACE_SHAPES.base;
  const basePoint=shapeRecipe.jawChinPointed || 0;

  const jawV=THREE.MathUtils.clamp(Number(currentJawlineValue)||0,-100,100)/100;
  const jawContribution=jawV<0 ? (-jawV)*.16 : 0;

  const userPoint=THREE.MathUtils.clamp(Number(currentChinPointValue)||0,0,100)/100;
  const userContribution=userPoint*.50;

  setMorph(
    'jawChinPointed',
    THREE.MathUtils.clamp(basePoint + jawContribution + userContribution,0,1)
  );
}

function setFaceShape(shape){

  const recipe=FACE_SHAPES[shape] || FACE_SHAPES.base;
  resetMorphs(FACE_SHAPE_MORPHS);
  Object.entries(recipe).forEach(([name,value])=>setMorph(name,value));

  document.querySelectorAll('[data-face-shape]').forEach(b=>{
    b.classList.toggle('on',b.dataset.faceShape===shape);

  const label=document.getElementById('faceShapeLabel');

const BROW_STYLE_PRESETS = {
  // V50: stessa forma/posizione V49, solo più piene e folte.
  base:     {width:0.98, thickness:1.54, arch:.12, tilt:.000, density:1.48, softness:.27, tailLift:.00},
  sottili:  {width:.92, thickness:1.00, arch:.075, tilt:-.004, density:1.08, softness:.18, tailLift:.00},
  spesse:   {width:1.04, thickness:2.02, arch:.13, tilt:.002, density:1.96, softness:.34, tailLift:.00},
  arcuate:  {width:.97, thickness:1.46, arch:.31, tilt:.032, density:1.55, softness:.29, tailLift:.06},
  dritte:   {width:1.00, thickness:1.32, arch:.020, tilt:-.018, density:1.38, softness:.25, tailLift:-.025}
};

function browCurveY(style,t){
  // 0..1 in texture space: arco naturale ma leggibile.
  const core = .565 - Math.sin(Math.PI*t) * style.arch;
  // Leggero lift o drop sulla coda per distinguere meglio gli stili.
  return core - (t-.5) * (style.tailLift || 0);
}

function deterministicJitter(i){
  const x=Math.sin(i*91.733+17.17)*43758.5453;
  return x-Math.floor(x);
}

function makeBrowTexture(styleKey){
  const style=BROW_STYLE_PRESETS[styleKey] || BROW_STYLE_PRESETS.base;
  const c=document.createElement('canvas');
  c.width=768; c.height=220;
  const ctx=c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);
  ctx.lineCap='round';
  ctx.lineJoin='round';

  const x0=44, span=680;
  const centerY=t=>browCurveY(style,t)*c.height;

  // Base soffice: aggiunge leggibilità ma resta organica.
  ctx.save();
  ctx.filter='blur(5px)';
  ctx.globalAlpha=0.18 + (style.softness||0);
  ctx.strokeStyle='#fff';
  ctx.lineWidth=14.5*style.thickness;
  ctx.beginPath();
  for(let s=0;s<=64;s++){
    const t=s/64;
    const x=x0+t*span;
    const y=centerY(t);
    if(s===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.restore();
  ctx.globalAlpha=1;

  // Secondo pass più compatto per dare corpo alla sopracciglia.
  ctx.save();
  ctx.globalAlpha=0.36;
  ctx.strokeStyle='#fff';
  ctx.lineWidth=6.2*style.thickness;
  ctx.beginPath();
  for(let s=0;s<=64;s++){
    const t=s/64;
    const x=x0+t*span;
    const y=centerY(t);
    if(s===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.restore();

  // Pelo individuale: più denso e più contrastato.
  const hairs=Math.round(300*style.thickness*(style.density||1));
  for(let i=0;i<hairs;i++){
    const r1=deterministicJitter(i*3+1);
    const r2=deterministicJitter(i*3+2);
    const r3=deterministicJitter(i*3+3);
    const t=.04 + r1*.92;
    const x=x0 + t*span;
    const yc=centerY(t);
    const band=(r2-.5)*(22*style.thickness);
    const len=(8+r3*13)*style.thickness;

    const inner=(1-t);
    const sweep=2.2 + 6.2*t;
    const dx=sweep*(r3>.48?1:.78);
    const dy=-(len*(.72+.34*inner));

    ctx.strokeStyle=`rgba(255,255,255,${(.44+r3*.48).toFixed(3)})`;
    ctx.lineWidth=1.05 + r2*1.65;
    ctx.beginPath();
    ctx.moveTo(x,yc+band);
    ctx.lineTo(x+dx,yc+band+dy);
    ctx.stroke();
  }

  // Micro hairs in senso opposto per rompere la rigidità.
  const flyaways=Math.round(36*style.thickness);
  for(let i=0;i<flyaways;i++){
    const r1=deterministicJitter(500+i*5+1);
    const r2=deterministicJitter(500+i*5+2);
    const t=.08 + r1*.84;
    const x=x0 + t*span;
    const yc=centerY(t);
    const len=5 + r2*6;
    ctx.strokeStyle='rgba(255,255,255,.20)';
    ctx.lineWidth=.75;
    ctx.beginPath();
    ctx.moveTo(x,yc-2);
    ctx.lineTo(x-2.5,yc-len);
    ctx.stroke();
  }

  // V45: smussa entrambe le estremità per evitare l'effetto ponte/blob al centro.
  ctx.save();
  ctx.globalCompositeOperation='destination-in';
  const edgeFade = ctx.createLinearGradient(0,0,c.width,0);
  edgeFade.addColorStop(0.00,'rgba(255,255,255,0)');
  edgeFade.addColorStop(0.12,'rgba(255,255,255,1)');
  edgeFade.addColorStop(0.88,'rgba(255,255,255,1)');
  edgeFade.addColorStop(1.00,'rgba(255,255,255,0)');
  ctx.fillStyle=edgeFade;
  ctx.fillRect(0,0,c.width,c.height);
  ctx.restore();

  const tex=new THREE.CanvasTexture(c);
  tex.colorSpace=THREE.SRGBColorSpace;
  tex.needsUpdate=true;
  return tex;
}


function makeIrisTexture(colorHex){
  const c=document.createElement('canvas');
  c.width=256; c.height=256;
  const ctx=c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);

  const cx=128, cy=128;
  const irisR=82;
  const pupilR=16;
  const key=(colorHex||'').toLowerCase();

  const palettes={
    '#5b3a21': { dark:'#2f2016', mid:'#5b3a21', light:'#8a6544', ring:'#241913' },
    '#7a5a2a': { dark:'#4e3a1f', mid:'#7a5a2a', light:'#a48754', ring:'#34281a' },
    '#4e6a3d': { dark:'#304327', mid:'#4e6a3d', light:'#7f9a65', ring:'#24311e' },
    '#4d6786': { dark:'#32465d', mid:'#4d6786', light:'#86a4c6', ring:'#263444' },
    '#6b7078': { dark:'#43484f', mid:'#6b7078', light:'#a2a8b0', ring:'#31353a' }
  };

  let dark, mid, light, ring;
  if(palettes[key]){
    dark=new THREE.Color(palettes[key].dark);
    mid=new THREE.Color(palettes[key].mid);
    light=new THREE.Color(palettes[key].light);
    ring=palettes[key].ring;
  }else{
    const iris=new THREE.Color(colorHex || '#5b3a21');
    const hsl={h:0,s:0,l:0};
    iris.getHSL(hsl);
    mid=iris.clone().setHSL(hsl.h, Math.min(.70, Math.max(.25, hsl.s*1.08)), Math.min(.55, Math.max(.34, hsl.l*1.06)));
    dark=mid.clone().multiplyScalar(.62);
    light=mid.clone().lerp(new THREE.Color('#e7d8c4'), .18);
    ring='#2d241f';
  }

  const irisGrad=ctx.createRadialGradient(cx,cy,18,cx,cy,irisR);
  irisGrad.addColorStop(0.00, `rgba(${Math.round(light.r*255)},${Math.round(light.g*255)},${Math.round(light.b*255)},1)`);
  irisGrad.addColorStop(0.28, `rgba(${Math.round(mid.r*255)},${Math.round(mid.g*255)},${Math.round(mid.b*255)},1)`);
  irisGrad.addColorStop(0.76, `rgba(${Math.round(dark.r*255)},${Math.round(dark.g*255)},${Math.round(dark.b*255)},1)`);
  irisGrad.addColorStop(1.00, ring);
  ctx.fillStyle=irisGrad;
  ctx.beginPath(); ctx.arc(cx,cy,irisR,0,Math.PI*2); ctx.fill();

  ctx.save();
  ctx.globalCompositeOperation='soft-light';
  for(let i=0;i<96;i++){
    const a=(Math.PI*2*i)/96;
    const inner=pupilR+4+((i%5)/5)*7;
    const outer=irisR-5-((i%7)/7)*8;
    const x1=cx+Math.cos(a)*inner, y1=cy+Math.sin(a)*inner;
    const x2=cx+Math.cos(a)*outer, y2=cy+Math.sin(a)*outer;
    ctx.strokeStyle=`rgba(255,255,255,${0.09+((i%9)/9)*0.10})`;
    ctx.lineWidth=1.1;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  }
  ctx.restore();

  const pupilGrad=ctx.createRadialGradient(cx-4,cy-5,3,cx,cy,pupilR);
  pupilGrad.addColorStop(0,'rgba(18,14,12,1)');
  pupilGrad.addColorStop(1,'rgba(5,4,4,1)');
  ctx.fillStyle=pupilGrad;
  ctx.beginPath(); ctx.arc(cx,cy,pupilR,0,Math.PI*2); ctx.fill();

  ctx.strokeStyle='rgba(255,255,255,.18)';
  ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(cx,cy,irisR-2,0,Math.PI*2); ctx.stroke();

  ctx.fillStyle='rgba(255,255,255,.80)';
  ctx.beginPath(); ctx.arc(cx-20,cy-20,7,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.30)';
  ctx.beginPath(); ctx.arc(cx+14,cy+14,3,0,Math.PI*2); ctx.fill();

  ctx.save();
  ctx.globalCompositeOperation='destination-in';
  const fade=ctx.createRadialGradient(cx,cy,irisR*.86,cx,cy,irisR+5);
  fade.addColorStop(0,'rgba(255,255,255,1)');
  fade.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=fade;
  ctx.beginPath(); ctx.arc(cx,cy,irisR+5,0,Math.PI*2); ctx.fill();
  ctx.restore();

  const tex=new THREE.CanvasTexture(c);
  tex.colorSpace=THREE.SRGBColorSpace;
  tex.needsUpdate=true;
  return tex;
}

function styleNativeEyeMaterials(){
  eyeColorMaterials.forEach(m=>{
    if(!m) return;
    if(m.color) m.color.set('#f4eee7');
    if('roughness' in m) m.roughness=.58;
    if('metalness' in m) m.metalness=0;
    if('envMapIntensity' in m) m.envMapIntensity=.45;
    if(m.emissive) m.emissive.set('#000000');
    if('emissiveIntensity' in m) m.emissiveIntensity=0;

  });
}

function ensureSyntheticEyes(){

  syntheticEyeRoot=new THREE.Group();
  syntheticEyeRoot.name='SyntheticEyes';
  model.add(syntheticEyeRoot);
  for(const side of [-1,1]){

    const mat=new THREE.MeshBasicMaterial({

    });

    mesh.name=side<0?'syntheticEyeLeft':'syntheticEyeRight';

function conformSyntheticIrisToEyeSurface(mesh, eyeBox, irisX, irisY, w, h){
  if(!mesh?.geometry?.attributes?.position || !eyeBox) return;

  const eyeCenter=eyeBox.getCenter(new THREE.Vector3());
  const eyeSize=eyeBox.getSize(new THREE.Vector3());

  // Approximate the native eye as an ellipsoid in model-local space.
  // The visible iris pixels occupy only the central part of the subdivided plane,
  // so this bends the iris itself while transparent outer fragments remain discarded.
  const rx=Math.max(eyeSize.x*.5, w*.55);
  const ry=Math.max(eyeSize.y*.5, h*.55);
  const rz=Math.max(eyeSize.z*.5, .006);

  // Tiny lift above the sclera prevents z-fighting, while remaining behind
  // eyelid skin at oblique/profile angles.
  const surfaceLift=.00028;

  const pos=mesh.geometry.attributes.position;
  for(let i=0;i<pos.count;i++){
    const gx=pos.getX(i);
    const gy=pos.getY(i);

    const px=irisX + gx*w;
    const py=irisY + gy*h;

    const nx=(px-eyeCenter.x)/rx;
    const ny=(py-eyeCenter.y)/ry;
    const radial=Math.max(0, 1 - nx*nx - ny*ny);

    const pz=eyeCenter.z + rz*Math.sqrt(radial) + surfaceLift;
    pos.setZ(i,pz);
  }

  pos.needsUpdate=true;
  mesh.geometry.computeBoundingBox();
  mesh.geometry.computeBoundingSphere();
}

function fitSyntheticEyesToFace(){
  if(!syntheticEyeRoot || !eyesMesh || !model) return;
  const boxes=eyeSideBoxesLocal();
  if(!boxes) return;

  const leftSize=boxes.left.getSize(new THREE.Vector3());
  const rightSize=boxes.right.getSize(new THREE.Vector3());
  const leftCenter=boxes.left.getCenter(new THREE.Vector3());
  const rightCenter=boxes.right.getCenter(new THREE.Vector3());
  const avgSize=new THREE.Vector3().addVectors(leftSize,rightSize).multiplyScalar(.5);

  // V59: start from the V54/V58 placement.
  // Keep size and depth the same.
  // Move the irises only a touch lower and a touch more outward.
  const avgY=((leftCenter.y+rightCenter.y)*.5) - .0022;
  // V70: no flat avgZ; depth follows each native eyeball surface.
  const baseAbsX=(Math.abs(leftCenter.x)+Math.abs(rightCenter.x))*.5;
  const outward=Math.max(.0016, avgSize.x*.030);

  // V61: keep V60 position exactly as-is.
  // Sync iris/pupil visual size with the "Occhi · dimensione" slider.
  // Range: -100 -> ~75%, 0 -> 100%, +100 -> ~125%.
  const irisScale=THREE.MathUtils.clamp(1 + currentEyeSize*.0025, .75, 1.25);
  const w=Math.max(.0205,avgSize.x*.58) * irisScale;
  const h=Math.max(.0145,avgSize.y*.56) * irisScale;

  syntheticEyeMeshes.forEach(m=>{
    const side=m.userData.side || 1;
    const x=side*(baseAbsX + outward);
    const eyeBox=side<0 ? boxes.left : boxes.right;

    // V70: preserve the approved frontal X/Y and iris size exactly.
    // Z now comes from the curved native eyeball surface instead of one flat plane.
    m.position.set(x,avgY,0);
    m.rotation.set(0,0,0);
    m.scale.set(w,h,1);
    conformSyntheticIrisToEyeSurface(m,eyeBox,x,avgY,w,h);
  });
  model.updateMatrixWorld(true);
}

function findEyesPrimitive(){
  return model.getObjectByName('Eyes') ||
    skinnedMeshes.find(m=>/^eyes$/i.test(m.name || '')) ||
    meshes.find(m=>/^eyes$/i.test(m.name || '')) || null;
}

function eyeSideBoxesLocal(){
  if(!eyesMesh || !eyesMesh.geometry?.attributes?.position || !model) return null;

  model.updateMatrixWorld(true);
  eyesMesh.updateMatrixWorld(true);

  const pos=eyesMesh.geometry.attributes.position;
  const invModel=model.matrixWorld.clone().invert();
  const pts=[];
  const v=new THREE.Vector3();

  for(let i=0;i<pos.count;i++){
    if(typeof eyesMesh.getVertexPosition==='function'){
      eyesMesh.getVertexPosition(i,v);
    }else{
      v.fromBufferAttribute(pos,i);
    }
    v.applyMatrix4(eyesMesh.matrixWorld).applyMatrix4(invModel);
    pts.push(v.clone());
  }
  if(!pts.length) return null;

  let minX=Infinity,maxX=-Infinity;
  pts.forEach(p=>{minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);});
  const mid=(minX+maxX)*.5;

  const left=new THREE.Box3(); left.makeEmpty();
  const right=new THREE.Box3(); right.makeEmpty();
  pts.forEach(p=>{
    if(p.x<mid) left.expandByPoint(p);
    else right.expandByPoint(p);
  });

  if(left.isEmpty() || right.isEmpty()) return null;
  return {left,right};
}

function raycastFaceLocal(x,y,startZ){
  if(!model || !bodyMesh) return null;
  model.updateMatrixWorld(true);
  bodyMesh.updateMatrixWorld(true);

  const originLocal=new THREE.Vector3(x,y,startZ);
  const originWorld=model.localToWorld(originLocal.clone());
  const dirWorld=new THREE.Vector3(0,0,-1).transformDirection(model.matrixWorld);
  browRaycaster.set(originWorld,dirWorld);
  browRaycaster.near=0;
  browRaycaster.far=2.0;

  const hit=browRaycaster.intersectObject(bodyMesh,false)[0];
  if(!hit) return null;
  return model.worldToLocal(hit.point.clone());
}

function ensureSyntheticBrows(){
  if(syntheticBrowRoot || !model || !eyesMesh || !bodyMesh) return;

  syntheticBrowRoot=new THREE.Group();

    });

function fitSyntheticBrowsToFace(){
  if(!syntheticBrowRoot || !eyesMesh || !model) return;
  const boxes=eyeSideBoxesLocal();
  if(!boxes) return;

  const h=THREE.MathUtils.clamp(currentBrowHeight,-100,100)/100;
  const a=THREE.MathUtils.clamp(currentBrowAngle,-100,100)/100;
  const style=BROW_STYLE_PRESETS[currentBrowStyle] || BROW_STYLE_PRESETS.base;

  eyebrowMeshes.forEach(m=>{
    if(!m.userData.synthetic) return;
    const side=m.userData.side || 1;
    const box=side<0 ? boxes.left : boxes.right;
    const size=box.getSize(new THREE.Vector3());
    const center=box.getCenter(new THREE.Vector3());

    // V49: look closer to V46 (higher + fuller), but with a small safe gap in the center.
    const browY=box.max.y + Math.max(.0024,size.y*.078) + h*.0048;
    const inward=Math.max(.0012,size.x*.055);
    const x=center.x - side*inward;
    const startZ=box.max.z+.17;
    const skin=raycastFaceLocal(x,browY,startZ);
    const z=skin ? skin.z+.00135 : box.max.z+.0032;

    m.position.set(x,browY,z);
    m.rotation.set(0,0,side*(a*.13+style.tilt*.92));

    const browW=Math.max(.051,size.x*1.07)*style.width;
    const browH=Math.max(.015,size.y*.48)*style.thickness;
    // Mirror the texture so both brows have the same inner-to-outer hair flow.
    m.scale.set(side<0 ? browW : -browW,browH,1);
  });
  model.updateMatrixWorld(true);
}

function applyEyeSpacing(){
  // Exact identity morphs exposed by parametric-base.glb.
  setSignedMorphPair(
    ['eyeInwardLeft','eyeInwardRight'],
    ['eyeOutwardLeft','eyeOutwardRight'],
    currentEyeSpacing
  );
  if(syntheticBrowRoot) fitSyntheticBrowsToFace();
  if(syntheticEyeRoot) fitSyntheticEyesToFace();
}

function applyEyeColor(colorHex){

  syntheticEyeMeshes.forEach(m=>{

  const label=document.getElementById('eyeColorV');

  };

  });
}

function skinAttrComponent(attr,index,component){
  if(!attr?.array) return 0;
  return attr.array[index*attr.itemSize+component] ?? 0;
}

function currentHeadBoxModelV80(){
  if(!bodyMesh?.geometry || !model) return null;

  const geo=bodyMesh.geometry;

  model.updateMatrixWorld(true);
  bodyMesh.skeleton?.update?.();

  const bodyBox=new THREE.Box3();
  const headBox=new THREE.Box3();
  const p=new THREE.Vector3();

  const total=geo.attributes.position.count;
  const step=Math.max(1,Math.floor(total/22000));

  // PASS 1: actual skinned body bounds in MODEL space.
  for(let i=0;i<total;i+=step){
    if(typeof bodyMesh.getVertexPosition==='function'){
      bodyMesh.getVertexPosition(i,p);
    }else{
      p.fromBufferAttribute(geo.attributes.position,i);
      if(typeof bodyMesh.applyBoneTransform==='function'){
        bodyMesh.applyBoneTransform(i,p);
      }
    }

    p.applyMatrix4(bodyMesh.matrixWorld);
    model.worldToLocal(p);
    bodyBox.expandByPoint(p);
  }

  if(bodyBox.isEmpty()) return null;

  const bodySize=bodyBox.getSize(new THREE.Vector3());
  const bodyHeight=bodySize.y;

  // The human head occupies roughly the upper 14–15% of standing height.
  // Crucially, shoulders/torso can no longer enlarge this box just because
  // they have some Head-bone influence.
  const headCutY=bodyBox.max.y - bodyHeight*.145;

  // PASS 2: only real geometry physically inside the upper head zone.
  for(let i=0;i<total;i+=step){
    if(typeof bodyMesh.getVertexPosition==='function'){
      bodyMesh.getVertexPosition(i,p);
    }else{
      p.fromBufferAttribute(geo.attributes.position,i);
      if(typeof bodyMesh.applyBoneTransform==='function'){
        bodyMesh.applyBoneTransform(i,p);
      }
    }

    p.applyMatrix4(bodyMesh.matrixWorld);
    model.worldToLocal(p);

    if(p.y>=headCutY){
      headBox.expandByPoint(p);
    }
  }

  if(headBox.isEmpty()) return null;

  // Safety clamp: even a pathological sampled vertex can never make the
  // detected "head" shoulder-width again.
  const size=headBox.getSize(new THREE.Vector3());
  const center=headBox.getCenter(new THREE.Vector3());

  const maxHeadWidth=bodyHeight*.115;
  const maxHeadDepth=bodyHeight*.135;

  if(size.x>maxHeadWidth){
    headBox.min.x=center.x-maxHeadWidth*.5;
    headBox.max.x=center.x+maxHeadWidth*.5;
  }
  if(size.z>maxHeadDepth){
    headBox.min.z=center.z-maxHeadDepth*.5;
    headBox.max.z=center.z+maxHeadDepth*.5;
  }

  return headBox;
}

function currentHeadBoxLocal(){
  if(!bodyMesh?.geometry || !texturedHairHeadBone) return null;

  const geo=bodyMesh.geometry;
  const skinIndex=geo.attributes.skinIndex;
  const skinWeight=geo.attributes.skinWeight;
  if(!skinIndex || !skinWeight) return null;

  const headIndex=bodyMesh.skeleton?.bones?.indexOf(texturedHairHeadBone) ?? -1;
  if(headIndex<0) return null;

  model.updateMatrixWorld(true);
  bodyMesh.skeleton?.update?.();
  texturedHairHeadBone.updateWorldMatrix(true,false);

  const box=new THREE.Box3();
  const p=new THREE.Vector3();
  let count=0;

  const total=geo.attributes.position.count;
  const step=Math.max(1,Math.floor(total/18000));

  for(let i=0;i<total;i+=step){
    let hw=0;
    for(let k=0;k<4;k++){
      if(skinAttrComponent(skinIndex,i,k)===headIndex){
        hw+=skinAttrComponent(skinWeight,i,k);
      }
    }
    if(hw<.40) continue;

    if(typeof bodyMesh.getVertexPosition==='function'){
      bodyMesh.getVertexPosition(i,p);
    }else{
      p.fromBufferAttribute(geo.attributes.position,i);
      if(typeof bodyMesh.applyBoneTransform==='function') bodyMesh.applyBoneTransform(i,p);
    }

    p.applyMatrix4(bodyMesh.matrixWorld);
    texturedHairHeadBone.worldToLocal(p);
    box.expandByPoint(p);
    count++;
  }

  if(count<20 || box.isEmpty()) return null;
  return box;
}

function objectBoundsInOwnLocalSpaceV76(root){
  if(!root) return null;

  root.updateMatrixWorld(true);
  const invRoot=new THREE.Matrix4().copy(root.matrixWorld).invert();
  const box=new THREE.Box3();
  const v=new THREE.Vector3();

  root.traverse(o=>{
    if(!o.isMesh || !o.geometry) return;

    if(!o.geometry.boundingBox) o.geometry.computeBoundingBox();
    const b=o.geometry.boundingBox;
    if(!b || b.isEmpty()) return;

    const rel=new THREE.Matrix4().multiplyMatrices(invRoot,o.matrixWorld);

    const xs=[b.min.x,b.max.x];
    const ys=[b.min.y,b.max.y];
    const zs=[b.min.z,b.max.z];

    for(const x of xs){
      for(const y of ys){
        for(const z of zs){
          v.set(x,y,z).applyMatrix4(rel);
          box.expandByPoint(v);
        }
      }
    }
  });

  return box.isEmpty() ? null : box;
}


function helperBlendForHm08V92(originalIndex){
  if(!mhBaseObjPositions || !mhOriginalToBodyVertex) return null;
  if(mhHelperBlendCacheV92.has(originalIndex)) return mhHelperBlendCacheV92.get(originalIndex);

  const src=mhBaseObjPositions[originalIndex];
  if(!src){
    mhHelperBlendCacheV92.set(originalIndex,null);
    return null;
  }

  const limit=Math.min(
    HM08_VISIBLE_BODY_VERTS_V85,
    mhBaseObjPositions.length,
    mhOriginalToBodyVertex.length
  );

  const K=6;
  const best=[];

  for(let i=0;i<limit;i++){
    const bodyIndex=mhOriginalToBodyVertex[i];
    if(bodyIndex===undefined || bodyIndex<0) continue;

    const p=mhBaseObjPositions[i];
    if(!p) continue;

    const dx=src[0]-p[0];
    const dy=src[1]-p[1];
    const dz=src[2]-p[2];
    const d2=dx*dx+dy*dy+dz*dz;

    if(best.length<K || d2<best[best.length-1].d2){
      const item={sourceIndex:i,bodyIndex,d2};
      let pos=best.length;
      while(pos>0 && best[pos-1].d2>d2) pos--;
      best.splice(pos,0,item);
      if(best.length>K) best.pop();
    }
  }

  if(!best.length){
    mhHelperBlendCacheV92.set(originalIndex,null);
    return null;
  }

  // Inverse-distance weighting. Il residuo preserva ESATTAMENTE la posizione
  // base dell'helper; quando il corpo si deforma, applichiamo solo una
  // deformazione media e continua ricavata dai vicini.
  let sumW=0;
  for(const n of best){
    n.w=1/Math.max(n.d2,1e-8);
    sumW+=n.w;
  }
  for(const n of best) n.w/=sumW;

  let bx=0,by=0,bz=0;
  for(const n of best){
    const p=mhBaseObjPositions[n.sourceIndex];
    bx+=p[0]*.1*n.w;
    by+=p[1]*.1*n.w;
    bz+=p[2]*.1*n.w;
  }

  const blend={
    neighbors:best,
    rx:src[0]*.1-bx,
    ry:src[1]*.1-by,
    rz:src[2]*.1-bz
  };

  mhHelperBlendCacheV92.set(originalIndex,blend);
  return blend;
}

function getCurrentHm08HelperSmoothV92(originalIndex,target){
  const blend=helperBlendForHm08V92(originalIndex);
  if(!blend || !bodyMesh) return false;

  const tmp=new THREE.Vector3();
  target.set(0,0,0);

  for(const n of blend.neighbors){
    bodyMesh.getVertexPosition(n.bodyIndex,tmp);
    target.x+=tmp.x*n.w;
    target.y+=tmp.y*n.w;
    target.z+=tmp.z*n.w;
  }

  target.x+=blend.rx;
  target.y+=blend.ry;
  target.z+=blend.rz;

  mhHelperBlendHitsV92++;
  return true;
}

function helperAnchorForHm08V85(originalIndex){
  if(!mhBaseObjPositions || !mhOriginalToBodyVertex) return null;
  if(mhHelperAnchorCacheV85.has(originalIndex)) return mhHelperAnchorCacheV85.get(originalIndex);

  const src=mhBaseObjPositions[originalIndex];
  if(!src){
    mhHelperAnchorCacheV85.set(originalIndex,null);
    return null;
  }

  const limit=Math.min(
    HM08_VISIBLE_BODY_VERTS_V85,
    mhBaseObjPositions.length,
    mhOriginalToBodyVertex.length
  );

  let bestSource=-1;
  let bestBody=-1;
  let bestD2=Infinity;

  // Lazy nearest-neighbour lookup. It runs only once per helper vertex and is
  // cached across hairstyle changes. This preserves the exact MakeHuman proxy
  // offsets instead of collapsing unsupported refs to (0,0,0).
  for(let i=0;i<limit;i++){
    const bodyIndex=mhOriginalToBodyVertex[i];
    if(bodyIndex===undefined || bodyIndex<0) continue;
    const p=mhBaseObjPositions[i];
    if(!p) continue;

    const dx=src[0]-p[0];
    const dy=src[1]-p[1];
    const dz=src[2]-p[2];
    const d2=dx*dx+dy*dy+dz*dz;
    if(d2<bestD2){
      bestD2=d2;
      bestSource=i;
      bestBody=bodyIndex;
      if(d2<1e-10) break;
    }
  }

  if(bestSource<0 || bestBody<0){
    mhHelperAnchorCacheV85.set(originalIndex,null);
    return null;
  }

  const base=mhBaseObjPositions[bestSource];
  const anchor={
    bodyIndex:bestBody,
    // base.obj is in decimetres while parametric-base.glb is in metres.
    dx:(src[0]-base[0])*.1,
    dy:(src[1]-base[1])*.1,
    dz:(src[2]-base[2])*.1,
    sourceIndex:bestSource,
    distance:Math.sqrt(bestD2)*.1
  };

  mhHelperAnchorCacheV85.set(originalIndex,anchor);
  return anchor;
}

function getCurrentHm08VertexVProxy(originalIndex,target){
  if(!mhOriginalToBodyVertex || !bodyMesh) return false;

  // Normal path for the 13,380 visible hm08 body vertices.
  const glbIndex=mhOriginalToBodyVertex[originalIndex];
  if(glbIndex!==undefined && glbIndex>=0){
    bodyMesh.getVertexPosition(glbIndex,target);
    return true;
  }

  // V92: SOLO la treccia usa il campo di deformazione morbido dei helper.
  // Gli altri tagli restano esattamente sul comportamento V85 già approvato.
  if(currentHairAssetV83==='braid01'){
    if(getCurrentHm08HelperSmoothV92(originalIndex,target)) return true;
  }

  // V85 fallback originale per Bob/Coda/Lungo e come sicurezza.
  const anchor=helperAnchorForHm08V85(originalIndex);
  if(!anchor) return false;

  bodyMesh.getVertexPosition(anchor.bodyIndex,target);
  target.x+=anchor.dx;
  target.y+=anchor.dy;
  target.z+=anchor.dz;
  mhHelperFallbackHitsV85++;
  return true;
}

function proxyScaleMatrixVProxy(){
  if(!mhProxyV) return null;

  const scales=new THREE.Vector3(1,1,1);
  const a=new THREE.Vector3();
  const b=new THREE.Vector3();

  for(let axis=0;axis<3;axis++){
    const d=mhProxyV.scaleData[axis];
    if(!d) continue;

    if(!getCurrentHm08VertexVProxy(d.v1,a) ||
       !getCurrentHm08VertexVProxy(d.v2,b)) return null;

    const num=Math.abs(
      axis===0 ? a.x-b.x :
      axis===1 ? a.y-b.y :
                 a.z-b.z
    );

    // MakeHuman getMatrix(): abs(co1[axis]-co2[axis]) / denominator.
    const s=num/Math.max(Math.abs(d.den),1e-9);
    if(axis===0) scales.x=s;
    if(axis===1) scales.y=s;
    if(axis===2) scales.z=s;
  }

  return scales;
}

function calculateProxyVertexPositionsVProxy(){
  if(!mhProxyV || !mhOriginalToBodyVertex) return null;

  const scale=proxyScaleMatrixVProxy();
  if(!scale) return null;

  const result=new Array(mhProxyV.refs.length);
  const a=new THREE.Vector3();
  const b=new THREE.Vector3();
  const c=new THREE.Vector3();

  for(let i=0;i<mhProxyV.refs.length;i++){
    const r=mhProxyV.refs[i];

    if(!getCurrentHm08VertexVProxy(r.v0,a) ||
       !getCurrentHm08VertexVProxy(r.v1,b) ||
       !getCurrentHm08VertexVProxy(r.v2,c)){
      return null;
    }

    result[i]=new THREE.Vector3(
      a.x*r.w0 + b.x*r.w1 + c.x*r.w2 + r.dx*scale.x,
      a.y*r.w0 + b.y*r.w1 + c.y*r.w2 + r.dy*scale.y,
      a.z*r.w0 + b.z*r.w1 + c.z*r.w2 + r.dz*scale.z
    );
  }

  return result;
}

function refineShortHairShapeV81(position, headBox){
  const size=headBox.getSize(new THREE.Vector3());
  const center=headBox.getCenter(new THREE.Vector3());
  const out=position.clone();

  // Compact scalp envelope for a believable short cut.
  const scalpCenter=new THREE.Vector3(
    center.x,
    headBox.max.y - size.y*.115,
    center.z + size.z*.01
  );

  const rx=Math.max(size.x*.60,1e-4);
  const ry=Math.max(size.y*.43,1e-4);
  const rz=Math.max(size.z*.72,1e-4);

  const dx=out.x-scalpCenter.x;
  const dy=out.y-scalpCenter.y;
  const dz=out.z-scalpCenter.z;

  const ell=Math.sqrt(
    (dx*dx)/(rx*rx) +
    (dy*dy)/(ry*ry) +
    (dz*dz)/(rz*rz)
  );

  const upperWeight=THREE.MathUtils.smoothstep(
    out.y,
    headBox.min.y + size.y*.44,
    headBox.max.y + size.y*.10
  );

  // Shrink any overshoot back toward a tight shell around the cranium.
  if(ell>1.02){
    const targetEll=1.02;
    const strength=THREE.MathUtils.clamp((ell-targetEll)/.60,0,1) * (.55 + upperWeight*.45);
    const s=THREE.MathUtils.lerp(1,targetEll/ell,strength);
    out.x=scalpCenter.x + dx*s;
    out.y=scalpCenter.y + dy*s;
    out.z=scalpCenter.z + dz*s;
  }

  // Keep the crown lower and less mushroom-like.
  const maxTopY=headBox.max.y + size.y*.05;
  if(out.y>maxTopY){
    const t=THREE.MathUtils.clamp((out.y-maxTopY)/(size.y*.20),0,1);
    out.y=THREE.MathUtils.lerp(out.y,maxTopY,.70 + t*.20);
    out.x=center.x + (out.x-center.x)*(1 - .06*t);
    out.z=center.z + (out.z-center.z)*(1 - .08*t);
  }

  // Pull down-hanging cards inward/upward so the cut stays short.
  const minCompactY=headBox.max.y - size.y*.34;
  if(out.y<minCompactY){
    const t=THREE.MathUtils.clamp((minCompactY-out.y)/(size.y*.24),0,1);
    out.y=THREE.MathUtils.lerp(out.y,minCompactY,.82);
    out.x=center.x + (out.x-center.x)*(1 - .18*t);
    out.z=center.z + (out.z-center.z)*(1 - .10*t);
  }

  // Light side tightening: enough to avoid the helmet effect, but without
  // flattening the front hairline.
  const sideNorm=Math.abs(out.x-center.x)/Math.max(size.x*.5,1e-4);
  if(sideNorm>.84){
    const t=THREE.MathUtils.clamp((sideNorm-.84)/.55,0,1);
    out.x=center.x + (out.x-center.x)*(1 - .16*t);
    out.z=center.z + (out.z-center.z)*(1 - .05*t);
  }

  return out;
}

function fitTexturedHairToHead(){
  // TRUE MakeHuman proxy update + compact refinement for a believable short cut.
  if(!mhProxyReady || !mhHairGeometry || !mhHairOutputOrigV) return;

  const proxyPositions=calculateProxyVertexPositionsVProxy();
  if(!proxyPositions) return;

  const headBox=currentHeadBoxModelV80();
  const attr=mhHairGeometry.attributes.position;

  for(let i=0;i<mhHairOutputOrigV.length;i++){
    const p=proxyPositions[mhHairOutputOrigV[i]];
    if(!p) continue;

    const finalPos=(headBox && currentHairAssetV83==='short02') ? refineShortHairShapeV81(p,headBox) : p;
    attr.setXYZ(i,finalPos.x,finalPos.y,finalPos.z);
  }

  attr.needsUpdate=true;
  mhHairGeometry.computeVertexNormals();
  mhHairGeometry.computeBoundingBox();
  mhHairGeometry.computeBoundingSphere();

  if(texturedHairRoot){
    texturedHairRoot.position.set(0,0,0);
    texturedHairRoot.rotation.set(0,0,0);
    texturedHairRoot.scale.set(1,1,1);
  }

  model?.updateMatrixWorld(true);
}

function mixHairV83(a,b,t){ return a+(b-a)*t; }

function hexRgbHairV83(hex){
  const h=String(hex||'#302018').replace('#','').padEnd(6,'0').slice(0,6);
  return {
    r:parseInt(h.slice(0,2),16)/255,
    g:parseInt(h.slice(2,4),16)/255,
    b:parseInt(h.slice(4,6),16)/255
  };
}

function buildTintedHairTextureV76(colorHex){
  if(!texturedHairTexture?.image) return null;

  if(String(colorHex).toLowerCase()==='#ffffff'){
    if(tintedHairTextureV76){ tintedHairTextureV76.dispose?.(); tintedHairTextureV76=null; }
    return texturedHairTexture;
  }

  const img=texturedHairTexture.image;
  const w=img.naturalWidth || img.videoWidth || img.width;
  const h=img.naturalHeight || img.videoHeight || img.height;
  if(!w || !h) return texturedHairTexture;

  const canvas=document.createElement('canvas');
  canvas.width=w; canvas.height=h;
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  if(!ctx) return texturedHairTexture;

  try{
    ctx.drawImage(img,0,0,w,h);
    const imageData=ctx.getImageData(0,0,w,h);
    const data=imageData.data;
    const base=hexRgbHairV83(colorHex);

    let minLum=1,maxLum=0;
    for(let i=0;i<data.length;i+=4){
      if(data[i+3]<8) continue;
      const l=(data[i]*.299+data[i+1]*.587+data[i+2]*.114)/255;
      minLum=Math.min(minLum,l); maxLum=Math.max(maxLum,l);
    }
    const range=Math.max(.08,maxLum-minLum);
    const baseLum=base.r*.299+base.g*.587+base.b*.114;
    const shadow={r:base.r*.16,g:base.g*.14,b:base.b*.13};
    const mid={r:base.r*.90,g:base.g*.90,b:base.b*.90};
    // V84: highlights much more restrained so the diffuse keeps strand detail
    // without looking lacquered/plastic under the backstage lights.
    const softLight={r:.92,g:.90,b:.86};
    const highlightStrength=THREE.MathUtils.clamp(.025+baseLum*.08,.025,.10);
    const highlight={
      r:mixHairV83(base.r,softLight.r,highlightStrength),
      g:mixHairV83(base.g,softLight.g,highlightStrength),
      b:mixHairV83(base.b,softLight.b,highlightStrength)
    };

    for(let i=0;i<data.length;i+=4){
      if(data[i+3]===0) continue;
      const sr=data[i]/255, sg=data[i+1]/255, sb=data[i+2]/255;
      let n=((sr*.299+sg*.587+sb*.114)-minLum)/range;
      n=Math.pow(THREE.MathUtils.clamp(n,0,1),.88);
      let rr,gg,bb;
      if(n<.62){
        const t=n/.62;
        rr=mixHairV83(shadow.r,mid.r,t);
        gg=mixHairV83(shadow.g,mid.g,t);
        bb=mixHairV83(shadow.b,mid.b,t);
      }else{
        const t=(n-.62)/.38;
        rr=mixHairV83(mid.r,highlight.r,t);
        gg=mixHairV83(mid.g,highlight.g,t);
        bb=mixHairV83(mid.b,highlight.b,t);
      }
      const chroma=((sr-sb)*.026+(sg-sb)*.012);
      data[i]=Math.round(THREE.MathUtils.clamp(rr+chroma,0,1)*255);
      data[i+1]=Math.round(THREE.MathUtils.clamp(gg+chroma*.35,0,1)*255);
      data[i+2]=Math.round(THREE.MathUtils.clamp(bb-chroma*.18,0,1)*255);
    }

    ctx.putImageData(imageData,0,0);
    if(tintedHairTextureV76) tintedHairTextureV76.dispose?.();
    const tex=new THREE.CanvasTexture(canvas);
    tex.colorSpace=THREE.SRGBColorSpace;
    tex.wrapS=texturedHairTexture.wrapS; tex.wrapT=texturedHairTexture.wrapT;
    tex.flipY=texturedHairTexture.flipY;
    tex.anisotropy=Math.min(16,renderer.capabilities.getMaxAnisotropy());
    tex.needsUpdate=true;
    tintedHairTextureV76=tex;
    return tex;
  }catch(err){
    console.warn('Tint capelli: uso texture originale',err);
    return texturedHairTexture;
  }
}

function parseMakeHumanObjVProxy(source){
  const positions=[];
  const uvs=[];
  const faces=[];

  for(const raw of source.split(/\r?\n/)){
    const line=raw.trim();
    if(!line || line.startsWith('#')) continue;

    if(line.startsWith('v ')){
      const p=line.split(/\s+/);
      positions.push([Number(p[1]),Number(p[2]),Number(p[3])]);
    }else if(line.startsWith('vt ')){
      const p=line.split(/\s+/);
      uvs.push([Number(p[1]),Number(p[2])]);
    }else if(line.startsWith('f ')){
      const corners=line.slice(2).trim().split(/\s+/).map(token=>{
        const parts=token.split('/');
        return {
          v: Number(parts[0])-1,
          vt: parts[1] ? Number(parts[1])-1 : -1
        };
      });
      if(corners.length>=3) faces.push(corners);
    }
  }

  return {positions,uvs,faces};
}

function parseMhcloVProxy(source,expectedVerts){
  const scaleData=[null,null,null];
  const refs=[];
  let inVerts=false;

  for(const raw of source.split(/\r?\n/)){
    const line=raw.trim();
    if(!line || line.startsWith('#')) continue;

    const p=line.split(/\s+/);
    const key=p[0];

    if(key==='x_scale'){
      scaleData[0]={v1:Number(p[1]),v2:Number(p[2]),den:Number(p[3])};
      continue;
    }
    if(key==='y_scale'){
      scaleData[1]={v1:Number(p[1]),v2:Number(p[2]),den:Number(p[3])};
      continue;
    }
    if(key==='z_scale'){
      scaleData[2]={v1:Number(p[1]),v2:Number(p[2]),den:Number(p[3])};
      continue;
    }

    if(key==='verts'){
      inVerts=true;
      continue;
    }

    if(inVerts){
      if(refs.length>=expectedVerts) break;

      // Old MakeHuman proxy format:
      // v0 v1 v2 w0 w1 w2 dx dy dz
      if(p.length>=9 &&
         /^-?\d+$/.test(p[0]) &&
         /^-?\d+$/.test(p[1]) &&
         /^-?\d+$/.test(p[2])){
        refs.push({
          v0:Number(p[0]), v1:Number(p[1]), v2:Number(p[2]),
          w0:Number(p[3]), w1:Number(p[4]), w2:Number(p[5]),
          dx:Number(p[6]), dy:Number(p[7]), dz:Number(p[8])
        });
      }
    }
  }

  if(refs.length!==expectedVerts){
    throw new Error(`mhclo refs ${refs.length} != OBJ verts ${expectedVerts}`);
  }
  if(scaleData.some(v=>!v)){
    throw new Error('mhclo x/y/z_scale incompleti');
  }

  return {scaleData,refs};
}

function quantizedVertexKeyVProxy(x,y,z){
  // Source OBJ is four-decimal MakeHuman data, GLB positions are float32.
  // Relative Y removes the single floor translation used by the GLB baker.
  const q=v=>Math.round(v*100000);
  return `${q(x)}|${q(y)}|${q(z)}`;
}

function buildHm08ToBodyMapVProxy(basePositions){
  if(!bodyMesh?.geometry?.attributes?.position) return null;

  const bind=bodyMesh.geometry.attributes.position;
  const map=new Int32Array(HM08_VISIBLE_BODY_VERTS_V85);
  map.fill(-1);

  let srcMinY=Infinity;
  for(let i=0;i<Math.min(HM08_VISIBLE_BODY_VERTS_V85,basePositions.length);i++){
    srcMinY=Math.min(srcMinY,basePositions[i][1]*.1);
  }

  let glbMinY=Infinity;
  for(let i=0;i<bind.count;i++){
    glbMinY=Math.min(glbMinY,bind.getY(i));
  }

  const lookup=new Map();
  for(let i=0;i<bind.count;i++){
    const key=quantizedVertexKeyVProxy(
      bind.getX(i),
      bind.getY(i)-glbMinY,
      bind.getZ(i)
    );
    if(!lookup.has(key)) lookup.set(key,i);
  }

  let mapped=0;
  for(let i=0;i<Math.min(HM08_VISIBLE_BODY_VERTS_V85,basePositions.length);i++){
    const s=basePositions[i];
    const key=quantizedVertexKeyVProxy(
      s[0]*.1,
      s[1]*.1-srcMinY,
      s[2]*.1
    );
    const idx=lookup.get(key);
    if(idx!==undefined){
      map[i]=idx;
      mapped++;
    }
  }

  console.info(`hm08→GLB mapping: ${mapped}/${HM08_VISIBLE_BODY_VERTS_V85}`);

  // We do not need every body vertex, but if topology matching catastrophically
  // fails it is safer to stop than render another giant wig.
  if(mapped<12000){
    throw new Error(`hm08 mapping insufficiente: ${mapped}/${HM08_VISIBLE_BODY_VERTS_V85}`);
  }

  return map;
}

function buildHairGeometryFromProxyVProxy(objData){
  const outIndex=new Map();
  const outputOrigV=[];
  const uvs=[];
  const indices=[];

  const cornerIndex=corner=>{
    const key=`${corner.v}/${corner.vt}`;
    let idx=outIndex.get(key);

    if(idx===undefined){
      idx=outputOrigV.length;
      outIndex.set(key,idx);
      outputOrigV.push(corner.v);

      const uv=corner.vt>=0 ? objData.uvs[corner.vt] : [0,0];
      uvs.push(uv[0],uv[1]);
    }
    return idx;
  };

  for(const face of objData.faces){
    const corners=face.map(cornerIndex);
    for(let i=2;i<corners.length;i++){
      indices.push(corners[0],corners[i-1],corners[i]);
    }
  }

  const geometry=new THREE.BufferGeometry();
  geometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(new Float32Array(outputOrigV.length*3),3)
  );
  geometry.setAttribute(
    'uv',
    new THREE.Float32BufferAttribute(new Float32Array(uvs),2)
  );
  geometry.setIndex(indices);

  mhHairOutputOrigV=outputOrigV;
  mhHairGeometry=geometry;
  return geometry;
}

async function ensureHm08MapV83(){
  if(mhBaseObjPositions && mhOriginalToBodyVertex) return;
  const bodyUrl='https://raw.githubusercontent.com/nirholas/three.ws/main/avatar-sources/anny/3dobjs/base.obj';
  const txt=await fetchTextVProxy(bodyUrl);
  const baseObj=parseMakeHumanObjVProxy(txt);
  mhBaseObjPositions=baseObj.positions;
  mhOriginalToBodyVertex=buildHm08ToBodyMapVProxy(mhBaseObjPositions);
}

function textureUrlsV83(assetKey,filename){

async function loadTextureRobustV83(assetKey,filename){
  let lastErr=null;
  for(const url of textureUrlsV83(assetKey,filename)){
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),30000);
    try{
      const response=await fetch(url,{mode:'cors',cache:'force-cache',signal:controller.signal});
      if(!response.ok) throw new Error(`HTTP ${response.status}`);
      const blob=await response.blob();
      if(blob.size<2048) throw new Error(`file troppo piccolo (${blob.size} B)`);
      const bitmap=await createImageBitmap(blob);
      const tex=new THREE.Texture(bitmap);
      tex.colorSpace=THREE.SRGBColorSpace;
      tex.wrapS=THREE.ClampToEdgeWrapping; tex.wrapT=THREE.ClampToEdgeWrapping;
      tex.anisotropy=Math.min(16,renderer.capabilities.getMaxAnisotropy());
      tex.needsUpdate=true;
      console.info('Texture capelli OK:',assetKey,filename,url,Math.round(blob.size/1024)+' KB');
      return {tex,url};
    }catch(err){
      lastErr=err;
      console.warn('Texture fallback fallito:',url,err);
    }finally{ clearTimeout(timer); }
  }
  throw lastErr || new Error('nessuna sorgente texture disponibile');
}

// V84: some MakeHuman hair packs do not use the same diffuse filename as the
// asset folder. Read any image filename declared in the .mhclo and then try
// conservative aliases. This fixes long01 without changing its geometry/UVs.
const HAIR_DIFFUSE_ALIASES_V84={
  long01:['long_diffuse.png','long01.png','long.png','hair_diffuse.png','hair.png']
};

function hairDiffuseCandidatesV84(assetKey,mhcloText=''){
  const out=[];
  const push=(name)=>{
    if(!name) return;
    const clean=String(name).trim().replace(/\\/g,'/').split('/').pop();
    if(!clean || !/\.(?:png|jpe?g)$/i.test(clean)) return;
    if(!out.some(v=>v.toLowerCase()===clean.toLowerCase())) out.push(clean);
  };

  // Prefer filenames explicitly referenced by the MakeHuman clothing/hair file.
  const matches=String(mhcloText).match(/[A-Za-z0-9_ .\-\/\\]+\.(?:png|jpe?g)/gi) || [];
  matches.forEach(push);
  push(HAIR_DIFFUSE_V83[assetKey]);
  (HAIR_DIFFUSE_ALIASES_V84[assetKey]||[]).forEach(push);
  return out;
}

async function loadHairDiffuseV84(assetKey,mhcloText=''){
  let lastErr=null;
  const candidates=hairDiffuseCandidatesV84(assetKey,mhcloText);
  for(const filename of candidates){
    try{
      const loaded=await loadTextureRobustV83(assetKey,filename);
      console.info('Diffuse capelli scelta:',assetKey,filename);
      return {...loaded,filename};
    }catch(err){
      lastErr=err;
      console.warn('Diffuse candidata non valida:',assetKey,filename,err);
    }
  }
  throw lastErr || new Error(`nessuna diffuse valida per ${assetKey}`);
}

function makeHairMaterialV83(){
  // V85: intentionally very matte. Keep the existing geometry/UV mapping,
  // but kill the hard synthetic highlights that made the cards look plastic.
  const mat=new THREE.MeshStandardMaterial({
    color:new THREE.Color(currentHairColor),
    roughness:.97,
    metalness:0,
    side:THREE.DoubleSide,
    transparent:false,
    alphaTest:.13,
    alphaToCoverage:true,
    depthWrite:true,
    depthTest:true,
    dithering:true
  });
  mat.envMapIntensity=.012;
  return mat;
}

function applyHairMaterialProfileV87(assetKey){
  if(!texturedHairMaterial) return;

  // Safe baseline for all hairstyles.
  texturedHairMaterial.transparent=false;
  texturedHairMaterial.side=THREE.DoubleSide;
  texturedHairMaterial.depthWrite=true;
  texturedHairMaterial.depthTest=true;
  texturedHairMaterial.roughness=.97;
  texturedHairMaterial.metalness=0;
  texturedHairMaterial.envMapIntensity=.012;
  texturedHairMaterial.alphaTest=.13;
  texturedHairMaterial.alphaToCoverage=true;

  // Dense cap-based styles were getting punched open on the crown.
  // Use an almost-zero cutoff and disable A2C to stop scalp holes.
  if(assetKey==='long01' || assetKey==='braid01'){
    texturedHairMaterial.alphaTest=.001;
    texturedHairMaterial.alphaToCoverage=false;
  }

  // Afro cards looked globally too transparent from the side.
  // Increase the cutoff so the silhouette reads denser and more solid.
  if(assetKey==='afro01'){
    texturedHairMaterial.alphaTest=.22;
    texturedHairMaterial.alphaToCoverage=false;
  }

  texturedHairMaterial.needsUpdate=true;
}

async function loadHairAssetV83(assetKey){
  const token=++hairRequestTokenV83;
  currentHairAssetV83=assetKey;

  document.querySelectorAll('[data-hair-asset]').forEach(b=>{
    b.classList.toggle('on',b.dataset.hairAsset===assetKey);
  });

  if(assetKey==='none'){
    texturedHairVisible=false;
    if(texturedHairRoot) texturedHairRoot.visible=false;
    const label=document.getElementById('hairStyleV'); if(label) label.textContent='nessuno';
    return;
  }

  texturedHairLoading=true;
  status.textContent=`CAPELLI · caricamento ${HAIR_LABELS_V83[assetKey]||assetKey}`;
  try{
    await ensureHm08MapV83();
    if(token!==hairRequestTokenV83) return;

    const base=`https://raw.githubusercontent.com/dmaugis/makehuman-custom/${HAIR_COMMIT_V83}/makehuman/data/hair/${assetKey}/`;
    const [objText,mhcloText]=await Promise.all([
      fetchTextVProxy(base+assetKey+'.obj'),
      fetchTextVProxy(base+assetKey+'.mhclo')
    ]);
    if(token!==hairRequestTokenV83) return;

    const objData=parseMakeHumanObjVProxy(objText);
    const proxy=parseMhcloVProxy(mhcloText,objData.positions.length);

    disposeHairV83();
    currentHairAssetV83=assetKey;
    mhHairObjData=objData; mhProxyV=proxy;
    const geometry=buildHairGeometryFromProxyVProxy(objData);
    texturedHairMaterial=makeHairMaterialV83();
    applyHairMaterialProfileV87(assetKey);

    const mesh=new THREE.Mesh(geometry,texturedHairMaterial);
    mesh.name=`MakeHuman_${assetKey}_mhclo_proxy`;
    mesh.castShadow=true; mesh.receiveShadow=true; mesh.frustumCulled=false;
    texturedHairObject=mesh;
    texturedHairRoot=new THREE.Group();
    texturedHairRoot.name=`HairRoot_${assetKey}`;
    model.add(texturedHairRoot); texturedHairRoot.add(mesh);
    mhProxyReady=true; texturedHairVisible=true;
    mhHelperFallbackHitsV85=0;
    mhHelperBlendHitsV92=0;
    fitTexturedHairToHead();
    console.info(
      'Hair helper refs resolved:',
      assetKey,
      'V92 smooth=',mhHelperBlendHitsV92,
      'V85 fallback=',mhHelperFallbackHitsV85
    );

    const label=document.getElementById('hairStyleV');
    if(label) label.textContent=HAIR_LABELS_V83[assetKey]||assetKey;

    // V85 diffuse loading: keep V84 fallbacks; helper-vertex geometry is now fixed separately.
    const diffuseCandidates=hairDiffuseCandidatesV84(assetKey,mhcloText);
    if(diffuseCandidates.length){
      try{
        const loaded=await loadHairDiffuseV84(assetKey,mhcloText);
        if(token!==hairRequestTokenV83){ loaded.tex.dispose?.(); return; }
        texturedHairTexture=loaded.tex;
        texturedHairMaterial.map=loaded.tex;
        texturedHairMaterial.color.set('#ffffff');
        texturedHairMaterial.needsUpdate=true;
        applyHairColor(currentHairColor);
        status.textContent=`CAPELLI · ${HAIR_LABELS_V83[assetKey]} · texture OK`;
      }catch(err){
        console.error('Diffuse capelli fallita dopo tutti i fallback',assetKey,diffuseCandidates,err);
        status.textContent=`CAPELLI · ${HAIR_LABELS_V83[assetKey]} · texture fallita`;
      }
    }

    // Normal maps are optional and intentionally subtle to avoid the faceted/plastic look.
    const normal=HAIR_NORMAL_V83[assetKey];
    if(normal){
      try{
        const loaded=await loadTextureRobustV83(assetKey,normal);
        if(token!==hairRequestTokenV83){ loaded.tex.dispose?.(); return; }
        texturedHairNormalV78=loaded.tex;
        texturedHairNormalV78.colorSpace=THREE.NoColorSpace;
        texturedHairMaterial.normalMap=texturedHairNormalV78;
        texturedHairMaterial.normalScale=new THREE.Vector2(.07,.07);
        texturedHairMaterial.needsUpdate=true;
      }catch(err){ console.info('Normal map non disponibile:',assetKey); }
    }

    texturedHairLoading=false;
  }catch(err){
    if(token!==hairRequestTokenV83) return;
    texturedHairLoading=false;
    console.error('Errore asset capelli',assetKey,err);
    status.textContent=`CAPELLI · errore ${assetKey}`;
  }
}

function loadFirstTexture(urls,onSuccess,onFail){
  const loader=new THREE.TextureLoader();
  loader.setCrossOrigin('anonymous');

  let index=0;
  const attempt=()=>{
    if(index>=urls.length){
      onFail?.();
      return;
    }

    const url=urls[index++];
    loader.load(url,tex=>{
      onSuccess(tex,url);
    },undefined,err=>{
      console.warn('Texture capelli fallita:',url,err);
      attempt();
    });
  };
  attempt();
}

function loadFirstObj(urls,onSuccess,onFail){
  const loader=new OBJLoader();
  let index=0;

  const attempt=()=>{
    if(index>=urls.length){
      onFail?.();
      return;
    }

    const url=urls[index++];
    loader.load(url,obj=>{
      onSuccess(obj,url);
    },undefined,err=>{
      console.warn('OBJ capelli fallito:',url,err);
      attempt();
    });
  };
  attempt();
}

function setJawline(value){
  currentJawlineValue=Number(value)||0;
  const v=THREE.MathUtils.clamp(currentJawlineValue,-100,100)/100;

  // Only lower-face controls are reset here. Crucially, headNarrower is NOT
  // touched by the jaw slider, because it also narrows temples / upper skull.
  ['jawNarrower','jawWider','headSquare','jawChinPointed']
    .forEach(name=>setMorph(name,0));

  // Preserve the currently selected face-shape recipe where it overlaps.
  const shapeRecipe=FACE_SHAPES[currentFaceShape] || FACE_SHAPES.base;
  const baseSquare=shapeRecipe.headSquare || 0;
  const basePoint=shapeRecipe.jawChinPointed || 0;
  if(baseSquare) setMorph('headSquare',baseSquare);
  if(basePoint) setMorph('jawChinPointed',basePoint);

  if(v>0){
    // Broader / squarer lower face, with restrained chin-width contribution.
    setMorph('headSquare', Math.min(1,baseSquare + v*.42));
    setMorph('jawWider', v*.34);
  }else if(v<0){
    const a=-v;
    // Narrow ONLY the lower face. No headNarrower here: temples and upper
    // cranium keep the shape chosen by Forma volto.
    setMorph('jawNarrower', a*.34);
  }

  applyChinPointComposite();
}

function applyCheekComposite(){
  const prominence=THREE.MathUtils.clamp(Number(currentCheekboneProminence)||0,0,100)/100;
  const volume=THREE.MathUtils.clamp(Number(currentCheekVolume)||0,-100,100)/100;

  // Prominence remains the same V66/V68 behaviour.
  setMorph('cheekBonesLeft', prominence*.90);
  setMorph('cheekBonesRight', prominence*.90);

  // Volume is independent: negative = hollow, positive = fuller.
  const hollow=volume<0 ? -volume : 0;
  const fuller=volume>0 ? volume : 0;
  setMorph('cheekHollowLeft', hollow*.72);
  setMorph('cheekHollowRight', hollow*.72);
  setMorph('cheekFullerLeft', fuller*.72);
  setMorph('cheekFullerRight', fuller*.72);
}

function setCheekboneProminence(value){
  currentCheekboneProminence=Number(value)||0;
  applyCheekComposite();
}

function setCheekVolume(value){
  currentCheekVolume=Number(value)||0;
  applyCheekComposite();
}
