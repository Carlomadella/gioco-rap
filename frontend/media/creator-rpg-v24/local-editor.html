const REFIT_BONES = [
  'Hips',
  'Spine','Spine1','Spine2',
  'Neck','Head',
  // Stop refitting the hand joints from skin-weight centroids.
  // That heuristic works for shoulder/elbow but is unstable at the wrist,
  // especially on the female body. The hands now inherit the forearm motion
  // from the neutral rig instead of being repositioned independently.
  'LeftShoulder','LeftArm','LeftForeArm',
  'RightShoulder','RightArm','RightForeArm',
  'LeftUpLeg','LeftLeg','LeftFoot',
  'RightUpLeg','RightLeg','RightFoot'
];

function cleanBoneName(name){
  return String(name||'')
    .replace(/^mixamorig\d*[:_]?/i,'')
    .replace(/[:_.-]/g,'')
    .toLowerCase();
}

function boneByCanonical(name){
  if(!bodyMesh || !bodyMesh.skeleton) return null;
  const wanted=cleanBoneName(name);
  return bodyMesh.skeleton.bones.find(b=>cleanBoneName(b.name)===wanted) || null;
}

function captureNeutralRig(){
  if(!model || !bodyMesh || !bodyMesh.skeleton) return;

  model.updateMatrixWorld(true);
  const invModel = new THREE.Matrix4().copy(model.matrixWorld).invert();
  const bones = new Map();

  bodyMesh.skeleton.bones.forEach((bone,index)=>{
    const wp=bone.getWorldPosition(new THREE.Vector3());
    const mp=wp.applyMatrix4(invModel);
    bones.set(bone.name,{
      index,
      position:bone.position.clone(),
      quaternion:bone.quaternion.clone(),
      scale:bone.scale.clone(),
      modelPosition:mp.clone()
    });
  });

  neutralRig={bones};
}

function restoreNeutralRig(){
  if(!neutralRig || !bodyMesh) return;
  for(const bone of bodyMesh.skeleton.bones){
    const r=neutralRig.bones.get(bone.name);
    if(!r) continue;
    bone.position.copy(r.position);
    bone.quaternion.copy(r.quaternion);
    bone.scale.copy(r.scale);
  }
  model.updateMatrixWorld(true);
}

function attr4(attr,vertex){
  return [
    attr.getX(vertex),
    attr.getY(vertex),
    attr.getZ(vertex),
    attr.getW(vertex)
  ];
}

// Build one anatomical tracker per major joint from vertices whose skin weights
// transition between the parent and the child bone.
// We only use the MOVEMENT of that centroid, never its absolute surface position.
function buildJointTrackers(){
  jointTrackers.clear();
  if(!bodyMesh || !bodyMesh.skeleton) return;

  const geo=bodyMesh.geometry;
  const pos=geo.attributes.position;
  const si=geo.attributes.skinIndex;
  const sw=geo.attributes.skinWeight;
  if(!pos || !si || !sw) return;

  const skeleton=bodyMesh.skeleton;
  const boneIndex=new Map(skeleton.bones.map((b,i)=>[b,i]));

  for(const canonical of REFIT_BONES){
    const bone=boneByCanonical(canonical);
    if(!bone) continue;
    const childIndex=boneIndex.get(bone);
    const parentIndex=boneIndex.get(bone.parent);

    const samples=[];
    let total=0, sx=0, sy=0, sz=0;

    if(parentIndex !== undefined){
      for(let v=0; v<pos.count; v++){
        const ids=attr4(si,v), ws=attr4(sw,v);
        let wc=0, wp=0;
        for(let k=0;k<4;k++){
          if(ids[k]===childIndex) wc+=ws[k];
          if(ids[k]===parentIndex) wp+=ws[k];
        }

        // Product peaks exactly in the parent/child transition zone.
        const score=wc*wp;
        if(score < 0.003) continue;

        samples.push([v,score]);
        total+=score;
        sx+=pos.getX(v)*score;
        sy+=pos.getY(v)*score;
        sz+=pos.getZ(v)*score;
      }
    }

    // Some joints have almost no blended transition vertices.
    // Fallback: follow the core surface strongly driven by this bone.
    if(samples.length < 8 || total < 0.02){
      samples.length=0; total=0; sx=sy=sz=0;
      for(let v=0; v<pos.count; v++){
        const ids=attr4(si,v), ws=attr4(sw,v);
        let wc=0;
        for(let k=0;k<4;k++) if(ids[k]===childIndex) wc+=ws[k];
        if(wc < 0.35) continue;
        const score=wc*wc;
        samples.push([v,score]);
        total+=score;
        sx+=pos.getX(v)*score;
        sy+=pos.getY(v)*score;
        sz+=pos.getZ(v)*score;
      }
    }

    if(!samples.length || total<=0) continue;

    jointTrackers.set(bone.name,{
      bone,
      samples,
      total,
      neutralCentroid:new THREE.Vector3(sx/total,sy/total,sz/total)
    });
  }

  console.log('rig-refit trackers', [...jointTrackers.entries()].map(([name,t])=>[name,t.samples.length]));
}

function activeBodyMorphs(){
  if(!bodyMesh || !bodyMesh.morphTargetDictionary || !bodyMesh.morphTargetInfluences) return [];
  const attrs=bodyMesh.geometry.morphAttributes?.position || [];
  const result=[];

  for(const [name,index] of Object.entries(bodyMesh.morphTargetDictionary)){
    const influence=bodyMesh.morphTargetInfluences[index] || 0;
    const attr=attrs[index];
    if(!attr || Math.abs(influence)<1e-5) continue;
    result.push({name,index,influence,attr});
  }
  return result;
}

function currentVertexPosition(v,active,out){
  const geo=bodyMesh.geometry;
  const base=geo.attributes.position;
  out.set(base.getX(v),base.getY(v),base.getZ(v));

  for(const m of active){
    if(geo.morphTargetsRelative){
      out.x += m.attr.getX(v)*m.influence;
      out.y += m.attr.getY(v)*m.influence;
      out.z += m.attr.getZ(v)*m.influence;
    }else{
      out.x += (m.attr.getX(v)-base.getX(v))*m.influence;
      out.y += (m.attr.getY(v)-base.getY(v))*m.influence;
      out.z += (m.attr.getZ(v)-base.getZ(v))*m.influence;
    }
  }
  return out;
}

function rebindSkinnedMeshes(){
  model.updateMatrixWorld(true);

  for(const mesh of skinnedMeshes){
    if(!mesh.skeleton) continue;
    mesh.updateMatrixWorld(true);

    // New joint positions become the new bind/rest skeleton.
    mesh.skeleton.calculateInverses();

    // Rebind in the mesh's current world frame so changing the rest skeleton
    // does not move/deform the already-morphed body at rest.
    mesh.bindMatrix.copy(mesh.matrixWorld);
    mesh.bindMatrixInverse.copy(mesh.matrixWorld).invert();
    mesh.skeleton.update();
  }
}

function refitSkeletonToCurrentBody(){
  if(!neutralRig || !bodyMesh) return;

  // Crucial: refit always starts from the authored neutral rig, never from the
  // previously posed or previously morphed skeleton.
  restoreNeutralRig();

  const active=activeBodyMorphs();
  const deltas=new Map();
  const tmp=new THREE.Vector3();

  // Measure how each anatomical skin-transition region moved under the active
  // body morphs. This gives the joint translation required by that body.
  for(const [boneName,t] of jointTrackers){
    let sx=0,sy=0,sz=0;
    for(const [v,score] of t.samples){
      currentVertexPosition(v,active,tmp);
      sx+=tmp.x*score;
      sy+=tmp.y*score;
      sz+=tmp.z*score;
    }
    const cur=new THREE.Vector3(sx/t.total,sy/t.total,sz/t.total);
    deltas.set(boneName,cur.sub(t.neutralCentroid));
  }

  // Desired joint origins in MODEL-LOCAL coordinates.
  const targetModelPos=new Map();
  for(const bone of bodyMesh.skeleton.bones){
    const r=neutralRig.bones.get(bone.name);
    if(!r) continue;
    const d=deltas.get(bone.name);
    targetModelPos.set(
      bone.name,
      d ? r.modelPosition.clone().add(d) : r.modelPosition.clone()
    );
  }

  // Parent first. Changing a joint's REST POSITION is the actual MakeHuman
  // behaviour; rotations remain the bind rotations here.
  const depth=(bone)=>{
    let d=0,n=bone.parent;
    while(n && n.isBone){ d++; n=n.parent; }
    return d;
  };
  const ordered=[...bodyMesh.skeleton.bones].sort((a,b)=>depth(a)-depth(b));

  model.updateMatrixWorld(true);
  for(const bone of ordered){
    const desiredModel=targetModelPos.get(bone.name);
    if(!desiredModel) continue;

    const desiredWorld=model.localToWorld(desiredModel.clone());
    if(bone.parent){
      bone.position.copy(bone.parent.worldToLocal(desiredWorld.clone()));
    }
    model.updateMatrixWorld(true);
  }

  rebindSkinnedMeshes();
}

function captureMalePoseRotations(){
  malePoseRotations=new Map();
  if(!bodyMesh) return;
  for(const bone of bodyMesh.skeleton.bones){
    malePoseRotations.set(bone.name,bone.quaternion.clone());
  }
}

function applyMalePoseRotations(){
  if(!malePoseRotations || !bodyMesh) return;

  for(const bone of bodyMesh.skeleton.bones){
    const clean=cleanBoneName(bone.name);
    const isHandOrFinger =
      clean.includes('hand') ||
      clean.includes('thumb') ||
      clean.includes('index') ||
      clean.includes('middle') ||
      clean.includes('ring') ||
      clean.includes('pinky');

    if(isHandOrFinger){
      // Keep wrists/fingers exactly in the authored neutral pose.
      const rest=neutralRig?.bones.get(bone.name);
      if(rest) bone.quaternion.copy(rest.quaternion);
      continue;
    }

    const q=malePoseRotations.get(bone.name);
    if(q) bone.quaternion.copy(q);
  }

  model.updateMatrixWorld(true);
  for(const mesh of skinnedMeshes) mesh.skeleton?.update();
}

function poseRelaxed(root){
  // Approved male pose. This is computed once on the correctly refitted male
  // rest skeleton. Later we copy ONLY these rotations to the female rig.
  const bones=[];
  root.traverse(o=>{ if(o.isBone) bones.push(o); });
  const clean = s => s.replace(/[:_.-]/g,'').toLowerCase();
  const find = suffix => bones.find(b => clean(b.name).endsWith(clean(suffix)));

  const la=find('LeftArm'),      ra=find('RightArm');
  const lf=find('LeftForeArm'), rf=find('RightForeArm');
  const lh=find('LeftHand'),     rh=find('RightHand');

  root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root);
  const centerX = (box.min.x + box.max.x) * .5;

  function aimBoneWorld(bone, child, desiredWorldDir){
    if(!bone || !child) return;
    root.updateMatrixWorld(true);

    const bp = bone.getWorldPosition(new THREE.Vector3());
    const cp = child.getWorldPosition(new THREE.Vector3());
    const current = cp.sub(bp).normalize();
    const desired = desiredWorldDir.clone().normalize();

    const delta = new THREE.Quaternion().setFromUnitVectors(current, desired);
    const worldQ = bone.getWorldQuaternion(new THREE.Quaternion());
    const wantedWorldQ = delta.multiply(worldQ);

    const parentWorldQ = bone.parent
      ? bone.parent.getWorldQuaternion(new THREE.Quaternion())
      : new THREE.Quaternion();
    const localQ = parentWorldQ.clone().invert().multiply(wantedWorldQ);
    bone.quaternion.copy(localQ);
    root.updateMatrixWorld(true);
  }

  for(const [arm, fore, hand] of [[la,lf,lh],[ra,rf,rh]]){
    if(!arm || !fore) continue;
    const shoulderX = arm.getWorldPosition(new THREE.Vector3()).x;
    const side = shoulderX < centerX ? -1 : 1;

    aimBoneWorld(arm, fore, new THREE.Vector3(side*.18, -1, .035));
    if(hand){
      aimBoneWorld(fore, hand, new THREE.Vector3(-side*.035, -1, .075));
    }
  }

  // Hands stay in their authored neutral local rotation.
  // The forearm drives their position/orientation naturally; no extra wrist twist.
  root.updateMatrixWorld(true);
}

function refitAndRepose(){
  refitSkeletonToCurrentBody();
  applyMalePoseRotations();
}

function pseudoNoise2D(x, y){
  const s = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
  return s - Math.floor(s);
}

function buildSkinDerivedMaps(baseTexture){
  const source = baseTexture && baseTexture.image;
  if(!source || !(source.width || source.naturalWidth)) return null;

  const srcW = source.naturalWidth || source.videoWidth || source.width;
  const srcH = source.naturalHeight || source.videoHeight || source.height;
  const maxDim = 1024;
  const scale = Math.min(1, maxDim / Math.max(srcW, srcH));
  const w = Math.max(8, Math.round(srcW * scale));
  const h = Math.max(8, Math.round(srcH * scale));

  const srcCanvas = document.createElement('canvas');
  srcCanvas.width = w; srcCanvas.height = h;
  const srcCtx = srcCanvas.getContext('2d', {willReadFrequently:true});
  srcCtx.drawImage(source, 0, 0, w, h);
  const srcImage = srcCtx.getImageData(0, 0, w, h);
  const src = srcImage.data;

  const lum = new Float32Array(w * h);
  for(let i=0, p=0; i<lum.length; i++, p+=4){
    const r = src[p], g = src[p+1], b = src[p+2];
    lum[i] = 0.2126 * r + 0.7152 * g + 0.0722 * b;
  }

  const roughCanvas = document.createElement('canvas');
  roughCanvas.width = w; roughCanvas.height = h;
  const roughCtx = roughCanvas.getContext('2d');
  const roughImg = roughCtx.createImageData(w, h);
  const rough = roughImg.data;

  const normalCanvas = document.createElement('canvas');
  normalCanvas.width = w; normalCanvas.height = h;
  const normalCtx = normalCanvas.getContext('2d');
  const normalImg = normalCtx.createImageData(w, h);
  const normal = normalImg.data;

  const clamp255 = v => Math.max(0, Math.min(255, v));
  const getLum = (x, y) => {
    x = Math.max(0, Math.min(w - 1, x));
    y = Math.max(0, Math.min(h - 1, y));
    return lum[y * w + x];
  };

  for(let y=0; y<h; y++){
    for(let x=0; x<w; x++){
      const i = y * w + x;
      const p = i * 4;
      const l = lum[i];

      const n1 = pseudoNoise2D(x * 0.37, y * 0.37) - 0.5;
      const n2 = pseudoNoise2D(x * 1.71 + 19.7, y * 1.71 + 7.3) - 0.5;
      const pore = n1 * 10 + n2 * 5;

      // Broad matte skin response with subtle per-pixel variation.
      const roughV = clamp255(194 + l * 0.10 + pore * 0.35);
      rough[p] = rough[p+1] = rough[p+2] = roughV;
      rough[p+3] = 255;

      const dx = (getLum(x+1,y) - getLum(x-1,y)) / 255;
      const dy = (getLum(x,y+1) - getLum(x,y-1)) / 255;
      const fine = (pseudoNoise2D(x * 2.6 + 1.3, y * 2.6 + 4.9) - 0.5) * 0.035;
      let nx = -(dx * 0.95 + fine);
      let ny = -(dy * 0.95 + fine * 0.55);
      let nz = 1.0;
      const invLen = 1 / Math.hypot(nx, ny, nz);
      nx *= invLen; ny *= invLen; nz *= invLen;

      normal[p]   = Math.round((nx * 0.5 + 0.5) * 255);
      normal[p+1] = Math.round((ny * 0.5 + 0.5) * 255);
      normal[p+2] = Math.round((nz * 0.5 + 0.5) * 255);
      normal[p+3] = 255;
    }
  }

  roughCtx.putImageData(roughImg, 0, 0);
  normalCtx.putImageData(normalImg, 0, 0);

  const roughnessMap = new THREE.CanvasTexture(roughCanvas);
  roughnessMap.flipY = false;
  roughnessMap.wrapS = roughnessMap.wrapT = THREE.ClampToEdgeWrapping;
  roughnessMap.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());

  const normalMap = new THREE.CanvasTexture(normalCanvas);
  normalMap.flipY = false;
  normalMap.wrapS = normalMap.wrapT = THREE.ClampToEdgeWrapping;
  normalMap.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());

  return { roughnessMap, normalMap };
}

function disposeSkinMaterial(mat){
  if(!mat || mat.name !== 'ADF_Skin_Pass1') return;
  if(mat.map) mat.map.dispose();
  if(mat.normalMap) mat.normalMap.dispose();
  if(mat.roughnessMap) mat.roughnessMap.dispose();
  mat.dispose();
}

function makeSkinMaterial(texture){
  // The source UVs are already converted for glTF in parametric-base.glb.
  texture.flipY = false;
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.wrapS = THREE.ClampToEdgeWrapping;
  texture.wrapT = THREE.ClampToEdgeWrapping;
  texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  texture.minFilter = THREE.LinearMipmapLinearFilter;
  texture.magFilter = THREE.LinearFilter;

  const derived = buildSkinDerivedMaps(texture) || {};

  const mat = new THREE.MeshPhysicalMaterial({
    map: texture,
    color: 0xffffff,
    metalness: 0.0,
    roughness: 1.0,
    roughnessMap: derived.roughnessMap || null,
    normalMap: derived.normalMap || null,
    normalScale: new THREE.Vector2(0.14, 0.14),

    // Broad, soft highlight without a plastic look.
    sheen: 0.05,
    sheenRoughness: 0.96,
    sheenColor: new THREE.Color(0xffd3c4),

    // Tiny top response only to stop the skin from reading as flat clay.
    clearcoat: 0.005,
    clearcoatRoughness: 0.98
  });

  mat.name = 'ADF_Skin_Pass1';
  return mat;
}

function applySkinForSex(sex){
  if(!bodyMesh) return;
  activeSkinSex = sex === 'female' ? 'female' : 'male';

  const requestedSex = activeSkinSex;
  const token = ++skinRequestToken;
  const urls = SKIN_TEXTURES[requestedSex] || [];

  function restoreFallback(){
    if(token !== skinRequestToken || !bodyMesh || !originalBodyMaterial) return;

    const oldMaterial = bodyMesh.material;
    bodyMesh.material = originalBodyMaterial;

    disposeSkinMaterial(oldMaterial)

    bodyMesh.material.needsUpdate = true;
    status.textContent = 'texture pelle non caricata · materiale V21 ripristinato';
  }

  function tryUrl(index){
    if(token !== skinRequestToken || requestedSex !== activeSkinSex) return;

    if(index >= urls.length){
      restoreFallback();
      return;
    }

    status.textContent =
      'carico texture pelle '+(requestedSex==='male'?'maschile':'femminile')+
      ' · sorgente '+(index+1)+'/'+urls.length+'…';

    skinTextureLoader.load(
      urls[index],
      texture=>{
        // Ignore an older request if the user changed sex while it loaded.
        if(token !== skinRequestToken || requestedSex !== activeSkinSex){
          texture.dispose();
          return;
        }

        const oldMaterial = bodyMesh.material;
        bodyMesh.material = makeSkinMaterial(texture);

        // Dispose only materials created by this skin pass.
        disposeSkinMaterial(oldMaterial)

        bodyMesh.material.needsUpdate = true;
        status.textContent =
          (requestedSex==='male'?'Maschile':'Femminile')+
          ' · texture pelle applicata · versione pulita game V25 · sorgente '+(index+1);
      },
      undefined,
      err=>{
        console.warn('Texture pelle sorgente '+(index+1)+' fallita', urls[index], err);
        tryUrl(index+1);
      }
    );
  }

  tryUrl(0);
}

function rebox(){
  bbox = new THREE.Box3().setFromObject(model);
  if(bbox.min.y !== 0){
    model.position.y -= bbox.min.y;
    bbox = new THREE.Box3().setFromObject(model);
  }
  heightWorld = bbox.max.y-bbox.min.y;
}

function projectY(worldPoint){
  const p = worldPoint.clone().project(camera);
  return (1 - (p.y + 1) * .5) * host.clientHeight;
}

function unusedAlignFeetToVisibleFloor(){
  // Il modello era a y=0 nel suo mondo, ma visivamente restava dentro lo specchio.
  // Qui allineiamo i piedi al pavimento DIPINTO nello sfondo (~88.5% della viewport).
  rebox();
  const foot = new THREE.Vector3(
    (bbox.min.x+bbox.max.x)/2,
    bbox.min.y,
    (bbox.min.z+bbox.max.z)/2
  );

  const desiredPx = host.clientHeight * .922;
  controls.update();
  camera.updateMatrixWorld(true);

  const y0 = projectY(foot);

  // Derivata numerica: spostare insieme camera e target verso l'alto
  // fa scendere il personaggio sullo schermo senza alterare l'inquadratura.
  const eps = Math.max(.02, heightWorld*.025);
  camera.position.y += eps;
  controls.target.y += eps;
  controls.update();
  camera.updateMatrixWorld(true);
  const y1 = projectY(foot);

  camera.position.y -= eps;
  controls.target.y -= eps;

  const deriv = (y1-y0)/eps;
  if(Math.abs(deriv) > .001){
    const dy = (desiredPx-y0)/deriv;
    camera.position.y += dy;
    controls.target.y += dy;
  }
  controls.update();
}

// Camera presets + smart zoom.
// Full is deliberately farther than the old 1.38× framing: the avatar should
// never become smaller than the approved whole-body composition.
let cameraViewState = 'full';
let cameraSyncBusy = false;

function smoothstep01(x){
  x=Math.max(0,Math.min(1,x));
  return x*x*(3-2*x);
}

function setEditorSection(section){
  document.querySelectorAll('[data-panel-section]').forEach(p=>{
    p.classList.toggle('active', p.dataset.panelSection===section);
  });

  // More directional light only in face editing mode.
  // Body mode restores the approved V35 lighting exactly.
  if(section==='face' || section==='hair'){
    hemi.intensity=1.62;
    faceSculptLight.intensity=.92;
  }else{
    hemi.intensity=2.1;
    faceSculptLight.intensity=0;
  }
}

function setViewButtonState(name){
  cameraViewState=name;

  // Camera shortcut buttons.
  document.querySelectorAll('[data-view]').forEach(b=>{
    b.classList.toggle('on', b.dataset.view===name);
  });

  // Main creator navigation and the editing tray follow the camera together.
  const section = name==='face' ? 'face' : 'body';
  document.querySelectorAll('.creator-nav [data-section]').forEach(b=>{
    b.classList.toggle('active', b.dataset.section===section);
  });
  setEditorSection(section);
}

function cameraMetrics(){
  rebox();
  const cx=(bbox.min.x+bbox.max.x)/2;
  const cz=(bbox.min.z+bbox.max.z)/2;

  // V32 endpoints: preserve approved full-body framing; move the face endpoint closer and higher.
  // FULL: enough distance to keep the whole avatar above the bottom editor UI.
  const fullFov=29;
  const faceFov=24;
  const fullDistance=heightWorld*3.18;
  const faceDistance=heightWorld*.88;

  // Put the feet just above the editor panel. This is calculated from the
  // actual DOM position, so resizing the browser does not hide the feet again.
  const panelEl=document.querySelector('.panel');
  const panelTop=panelEl ? panelEl.getBoundingClientRect().top : host.clientHeight*.82;
  const footPx=Math.max(host.clientHeight*.62, Math.min(host.clientHeight*.86, panelTop-28));
  const footNdc=1-(2*footPx/host.clientHeight);
  const fullTargetY=bbox.min.y-footNdc*fullDistance*Math.tan(THREE.MathUtils.degToRad(fullFov*.5));

  // FACE: aim lower than the eyes so the authored preset shows head + shoulders,
  // matching the requested close-up instead of filling the screen with the face.
  const faceTargetY=bbox.min.y+heightWorld*.835;

  return {
    cx,cz,fullTargetY,faceTargetY,fullDistance,faceDistance,
    fullFov,faceFov,footPx,footNdc
  };
}

function syncBackgroundToZoom(zoomT){
  // Keep the 2D room visually tied to the 3D camera.
  // Intero = original composition. Volto = subtle cinematic push-in.
  const t = smoothstep01(THREE.MathUtils.clamp(zoomT,0,1));
  const scale = THREE.MathUtils.lerp(1.0, 1.18, t);

  // When the 3D target rises toward the face, the room moves slightly down
  // on screen, mimicking an upward camera pan. Keep it deliberately subtle.
  const shiftY = THREE.MathUtils.lerp(0, host.clientHeight * 0.022, t);

  if(bgLayer){
    bgLayer.style.transform = `translate3d(0,${shiftY}px,0) scale(${scale})`;
  }
  if(blurLayer){
    // The blurred safety layer follows the same motion, preserving its
    // original 1.04 overscan so no border can appear during the push-in.
    blurLayer.style.transform = `translate3d(0,${shiftY}px,0) scale(${scale * 1.04})`;
  }
}

function applyCameraLimits(){
  if(!model) return;
  const m=cameraMetrics();
  // Hard endpoints: the user can move continuously between these two authored
  // compositions, but cannot zoom closer than Volto or farther than Intero.
  controls.minDistance=m.faceDistance;
  controls.maxDistance=m.fullDistance;
}

function view(name){
  if(!model)return;
  const m=cameraMetrics();
  applyCameraLimits();

  if(name==='face'){
    camera.fov=m.faceFov;
    camera.updateProjectionMatrix();
    controls.target.set(m.cx,m.faceTargetY,m.cz);
    camera.position.set(m.cx,m.faceTargetY,m.cz+m.faceDistance);
    setViewButtonState('face');
    syncBackgroundToZoom(1);
  } else {
    // Intero: feet stay above the editor UI and this is the hard zoom-out limit.
    camera.fov=m.fullFov;
    camera.updateProjectionMatrix();
    controls.target.set(m.cx,m.fullTargetY,m.cz);
    camera.position.set(m.cx,m.fullTargetY,m.cz+m.fullDistance);
    setViewButtonState('full');
    syncBackgroundToZoom(0);
  }

  controls.update();
}

function syncSmartZoom(){
  if(!model || cameraSyncBusy) return;
  cameraSyncBusy=true;

  const m=cameraMetrics();
  controls.minDistance=m.faceDistance;
  controls.maxDistance=m.fullDistance;

  // OrbitControls has already changed the radius. Clamp both authored endpoints
  // here too, so resizing/body changes cannot bypass the wheel limits.
  let d=camera.position.distanceTo(controls.target);
  if(d>m.fullDistance || d<m.faceDistance){
    const clamped=THREE.MathUtils.clamp(d,m.faceDistance,m.fullDistance);
    const dir=camera.position.clone().sub(controls.target).normalize();
    camera.position.copy(controls.target).addScaledVector(dir,clamped);
    d=clamped;
  }

  // Start climbing toward the head BEFORE the camera reaches the torso.
  // At ~78% of the full distance the focus begins to move upward; around the
  // face range it is fully locked to the head.
  const focusStart=m.fullDistance*.76;
  const focusEnd=m.faceDistance*1.18;
  const raw=1-(d-focusEnd)/(focusStart-focusEnd);
  const faceFocus=smoothstep01(raw);

  // Smoothly blend the two endpoint FOVs first, because the vertical
  // framing calculation depends on the actual FOV currently being used.
  const nextFov=THREE.MathUtils.lerp(m.fullFov,m.faceFov,faceFocus);
  if(Math.abs(camera.fov-nextFov)>.01){
    camera.fov=nextFov;
    camera.updateProjectionMatrix();
  }

  // V63: calculate the full-body vertical target from the REAL current
  // camera radius, not from m.fullDistance. This matters after changing
  // character height: V62 intentionally preserves camera distance so height
  // remains visibly different, therefore using the theoretical new max
  // distance pushed the feet behind the editor panel.
  const distanceAwareFullTargetY =
    bbox.min.y - m.footNdc*d*Math.tan(THREE.MathUtils.degToRad(nextFov*.5));

  const desiredY=THREE.MathUtils.lerp(
    distanceAwareFullTargetY,
    m.faceTargetY,
    faceFocus
  );
  const dy=desiredY-controls.target.y;
  if(Math.abs(dy)>1e-6){
    // Move camera and target together: keeps orbit angle/radius intact,
    // changing only what the zoom is visually centred on.
    controls.target.y+=dy;
    camera.position.y+=dy;
  }
  controls.target.x=m.cx;
  controls.target.z=m.cz;

  // Keep the Volto / Intero selector tied to the REAL zoom radius, not to
  // the focus interpolation. This makes the visual selector follow the wheel
  // reliably even while target/FOV are being blended.
  const zoomT = THREE.MathUtils.clamp(
    (m.fullDistance - d) / (m.fullDistance - m.faceDistance),
    0, 1
  );

  // Same real zoom radius drives the 2D room, so avatar and backstage
  // visually push in/out together.
  syncBackgroundToZoom(zoomT);

  // Small hysteresis around the midpoint avoids flicker without making the
  // selector feel delayed.
  if(cameraViewState==='full' && zoomT>.54) setViewButtonState('face');
  else if(cameraViewState==='face' && zoomT<.46) setViewButtonState('full');

  cameraSyncBusy=false;
}

setupFaceControls();

function setupTexturedHairControls(){
  document.querySelectorAll('[data-hair-asset]').forEach(b=>{
    b.onclick=()=>loadHairAssetV83(b.dataset.hairAsset);
  });

  document.querySelectorAll('[data-hair-color]').forEach(b=>{
    b.onclick=()=>{
      applyHairColor(b.dataset.hairColor);
      document.getElementById('hairCustomBtn')?.classList.remove('on');
    };
  });

  const customBtn=document.getElementById('hairCustomBtn');
  const customInput=document.getElementById('hairCustomColor');
  const customDot=document.getElementById('hairCustomDot');

  if(customBtn && customInput){
    customBtn.onclick=()=>customInput.click();
    customInput.oninput=()=>{
      const color=customInput.value;
      applyHairColor(color);
      if(customDot) customDot.style.background=color;
      customBtn.classList.add('on');
      document.querySelectorAll('[data-hair-color]').forEach(b=>b.classList.remove('on'));
    };
  }
}
setupTexturedHairControls();

new GLTFLoader().load('https://raw.githubusercontent.com/nirholas/three.ws/main/public/avatars/parametric-base.glb', gltf=>{
  model=gltf.scene;
  scene.add(model);

  model.traverse(o=>{
    if(o.isMesh && o.morphTargetDictionary) meshes.push(o);
    if(o.isSkinnedMesh) skinnedMeshes.push(o);
  });
  bodyMesh=skinnedMeshes.find(m=>m.name==='Body') || skinnedMeshes[0] || null;
  eyesMesh=skinnedMeshes.find(m=>m.name==='Eyes') || null;

  if(!bodyMesh || !bodyMesh.skeleton){
    status.textContent='errore: rig parametrico non trovato';
    return;
  }

  originalBodyMaterial = bodyMesh.material;
  initOptionalFaceFeatures();

  // Capture the TRUE authored bind rig before pose or morph.
  model.updateMatrixWorld(true);
  captureNeutralRig();
  buildJointTrackers();

  // Fase 1 default: male morphology first, THEN refit the skeleton to it.
  setMorph('bodyFeminine',0);
  setMorph('bodyMasculine',1);
  setMorph('bodyMuscular',.10);
  setMorph('bodyHeavier',0);
  setMorph('bodyThinner',0);
  setMorph('bodySofter',0);
  setMorph('heightTaller',0);
  setMorph('heightShorter',0);

  refitSkeletonToCurrentBody();

  // Compute the approved pose ONCE on the correctly fitted male rig.
  poseRelaxed(model);
  captureMalePoseRotations();

  rebox();

  // contact shadow: ancorato esattamente a y=0
  contactShadow = new THREE.Mesh(
    new THREE.CircleGeometry(Math.max(.15,(bbox.max.x-bbox.min.x)*.45),48),
    new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.26,depthWrite:false})
  );
  contactShadow.rotation.x=-Math.PI/2;
  contactShadow.position.set((bbox.min.x+bbox.max.x)/2,.002,(bbox.min.z+bbox.max.z)/2);
  scene.add(contactShadow);

  loadTexturedHairMhcloProxy();

  status.textContent = 'corpo pronto · caricamento capelli textured';
  h.oninput();
  w.oninput();
  view('full');

  // Skin is loaded last and does not participate in rig/morph setup.
  applySkinForSex('male');
}, undefined, e=>{
  status.textContent='errore caricamento base parametrica';
  console.error(e);
});


function setSex(sex){
  if(!model) return;

  const male = sex === 'male';
  setMorph('bodyMasculine', male ? 1 : 0);
  setMorph('bodyFeminine', male ? 0 : 1);

  document.querySelectorAll('[data-sex]').forEach(b=>{
    b.classList.toggle('on', b.dataset.sex === sex);
  });

  // Shape changes first; then the rest joints are fitted to that shape;
  // finally the exact male pose rotations are copied onto the fitted rig.
  applyPhysicalMorphs();
  rebox();

  const current=document.querySelector('[data-view].on')?.dataset.view || 'full';
  view(current);
  // Skin is a visual layer only: change diffuse after body/rig update.
  applySkinForSex(male ? 'male' : 'female');
}

document.querySelectorAll('[data-sex]').forEach(b=>{
  b.onclick=()=>setSex(b.dataset.sex);
});

document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{
  view(b.dataset.view);
});

// Main dock shortcuts mirror the camera presets. Later these same buttons
// will also reveal their real editing panels; for now they are honest camera/section selectors.
document.querySelectorAll('.creator-nav [data-section]').forEach(b=>b.onclick=()=>{
  const section=b.dataset.section;

  if(section==='hair'){
    view('face');
    document.querySelectorAll('.creator-nav [data-section]').forEach(n=>{
      n.classList.toggle('active',n.dataset.section==='hair');
    });
    setEditorSection('hair');
    return;
  }

  view(section==='face' ? 'face' : 'full');
});

const h=document.getElementById('height'), w=document.getElementById('weight'), build=document.getElementById('build');

h.oninput=()=>{
  const v=+h.value;
  document.getElementById('hv').textContent=v+' cm';
  if(!model) return;

  // V62: preserve the current camera framing while height changes.
  // Previously view('full') recomputed camera distance from heightWorld,
  // visually cancelling almost all of the height difference.
  const savedCameraPos = camera.position.clone();
  const savedTarget = controls.target.clone();

  setMorph('heightTaller', 0);
  setMorph('heightShorter', 0);
  currentHeightScale = v / BASE_HEIGHT_CM;
  applyBodyScale();

  camera.position.copy(savedCameraPos);
  controls.target.copy(savedTarget);
  controls.update();
};
function applyPhysicalMorphs(){
  if(!model) return;

  const wv=+w.value;
  const bv=+build.value;

  currentWeightHeavy = wv>=72 ? (wv-72)/(140-72) : 0;
  currentWeightThin  = wv<72 ? (72-wv)/(72-45) : 0;

  setMorph('bodyHeavier', Math.min(1, currentWeightHeavy * 1.45));
  setMorph('bodyThinner', Math.min(1, currentWeightThin * 1.10));
  setMorph('bodyMuscular', bv>0 ? .10 + (bv/100)*.75 : .10);
  setMorph(
    'bodySofter',
    Math.max(currentWeightHeavy * 0.95, bv<0 ? (-bv/100)*.55 : 0)
  );

  // This is the part missing from V15–V18.
  refitAndRepose();
  applyBodyScale();
}

w.oninput=()=>{
  const v=+w.value;
  document.getElementById('wv').textContent=v+' kg';
  if(!model) return;

  applyPhysicalMorphs();

  const current=document.querySelector('[data-view].on')?.dataset.view || 'full';
  if(current==='full') view('full');
};

build.oninput=()=>{
  const v=+build.value;
  document.getElementById('bv').textContent=v>35?'atletica':v<-35?'morbida':'media';
  if(!model) return;

  applyPhysicalMorphs();

  const current=document.querySelector('[data-view].on')?.dataset.view || 'full';
  if(current==='full') view('full');
};


function animate(){
  requestAnimationFrame(animate);
  controls.update();
  syncSmartZoom();
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  renderer.setSize(host.clientWidth,host.clientHeight);
  camera.aspect=host.clientWidth/host.clientHeight;
  camera.updateProjectionMatrix();
  applyCameraLimits();
});
</script>

<div class="adf-local-actions"><button id="adfLocalCancel">Annulla</button><button class="ok" id="adfLocalConfirm">Conferma personaggio →</button></div>
<script>
(()=>{
  const val=id=>document.getElementById(id)?.value ?? null;
  const active=attr=>{
    const all=[...document.querySelectorAll('['+attr+']')];
    const el=all.find(x=>x.classList.contains('on')||x.classList.contains('active'))||all[0];
    return el ? el.getAttribute(attr) : null;
  };
  function snapshot(){
    try{
      if(window.renderer && window.scene && window.camera) window.renderer.render(window.scene,window.camera);
      const c=(window.renderer&&window.renderer.domElement)||document.querySelector('#viewer canvas');
      return c ? c.toDataURL('image/png') : '';
    }catch(e){ return ''; }
  }
  function payload(){
    const sliders={};
    ['faceEyes','faceEyeSpacing','faceBrowHeight','faceBrowAngle','faceCheeks','faceCheekVolume','faceJaw','faceChinLength','faceChinDepth','faceChinPoint','faceNoseSize','faceNoseWidth','faceNoseLength','faceNoseTip','faceNoseProfile','faceNostrils','faceMouthWidth','faceMouthDepth','faceMouthCorners','faceUpperLip','faceLowerLip','faceEarSize','faceEarWing'].forEach(id=>{const v=val(id);if(v!==null)sliders[id]=Number(v)});
    const previewImage=snapshot();
    return {
      avatarPreviewImage:previewImage, previewImage,
      localAvatar:{
        sex:active('data-sex'), height:Number(val('height')||178), weight:Number(val('weight')||72), build:Number(val('build')||0),
        hairAsset:active('data-hair-asset'), hairColor:active('data-hair-color') || val('hairCustomColor'),
        faceShape:active('data-face-shape'), eyeColor:active('data-eye-color') || val('eyeCustomColor'),
        browStyle:active('data-brow-style'), browColor:active('data-brow-color') || val('browCustomColor'), sliders
      }
    };
  }
  document.getElementById('adfLocalConfirm').onclick=()=>window.parent.postMessage({type:'adf-local-avatar-complete',artist:payload()},'*');
  document.getElementById('adfLocalCancel').onclick=()=>window.parent.postMessage({type:'adf-local-avatar-cancel'},'*');
  window.parent.postMessage({type:'adf-local-avatar-ready'},'*');
})();
</script>
