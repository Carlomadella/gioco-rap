<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MakeHuman mobile bridge</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050609}
iframe{display:block;width:100%;height:100%;border:0;background:#050609}
</style>
</head>
<body>
<iframe id="makehuman-mobile-inner"
        src="../makehuman-camerino-v1/index.html?v=mobile-3"
        title="Editor MakeHuman personaggio"></iframe>
<script>
"use strict";
(()=>{
  const inner=document.getElementById("makehuman-mobile-inner");
  let innerCaricato=false;
  const coda=[];

  /* Questo file e' solo un relay. Il watchdog mobile NON vive qui:
     il creator viene nascosto durante l'avvio rapido e i browser mobili
     possono sospendere i timer degli iframe non visibili. */
  inner.addEventListener("load",()=>{
    innerCaricato=true;
    while(coda.length){
      try{ inner.contentWindow.postMessage(coda.shift(),"*"); }catch(e){}
    }
  });

  window.addEventListener("message",event=>{
    if(event.source===parent){
      if(innerCaricato){
        try{ inner.contentWindow.postMessage(event.data,"*"); }catch(e){}
      }else{
        coda.push(event.data);
      }
      return;
    }

    if(event.source!==inner.contentWindow) return;

    try{ parent.postMessage(event.data,"*"); }catch(e){}
  });
})();
</script>
</body>
</html>
