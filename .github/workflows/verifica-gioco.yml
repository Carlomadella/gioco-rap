name: Verifica gioco

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Push del branch e pull_request devono essere lo STESSO lavoro logico.
  # github.ref cambia (refs/heads/... vs refs/pull/.../merge), head_ref no:
  # senza questo ogni patch di una PR lanciava due CI identici in parallelo.
  group: verifica-gioco-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verifica:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installa dipendenze bloccate
        run: npm ci

      - name: Installa Chromium per Playwright
        run: npx playwright install --with-deps chromium

      - name: Prova, regressioni, browser e build
        run: npm run verifica

      # Il flusso Avvio rapido -> cinematic -> hub e' gia' nel gate normale
      # con un doppio del solo iframe MakeHuman. Il motore MakeHuman reale
      # resta verificabile esplicitamente, senza rendere rosso ogni push per
      # limiti/prestazioni del runner headless GitHub.
      - name: MakeHuman reale (solo avvio manuale)
        if: github.event_name == 'workflow_dispatch'
        run: npm run test:e2e:makehuman


