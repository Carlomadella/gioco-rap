name: Verifica gioco

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verifica-gioco-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifica:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installa dipendenze bloccate
        run: npm ci

      - name: Installa Chromium per Playwright
        run: npx playwright install --with-deps chromium

      - name: Prova, regressioni, browser e build
        run: npm run verifica


