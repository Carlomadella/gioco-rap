name: Verifica Neural hardening
on:
  push:
    paths:
      - 'frontend/strumenti/fame-neural-composer/**'
      - '.github/workflows/verifica-neural-hardening.yml'
  pull_request:
    paths:
      - 'frontend/strumenti/fame-neural-composer/**'
      - '.github/workflows/verifica-neural-hardening.yml'
permissions:
  contents: read
jobs:
  neural:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node frontend/strumenti/fame-neural-composer/hardening-owned-beats-test.js
      - run: node frontend/strumenti/fame-neural-composer/owned-beats-review-test.js
      - run: node frontend/strumenti/fame-neural-composer/owned-beats-audio-analysis-v2-protocol-test.js
      - run: node frontend/strumenti/fame-neural-composer/owned-beats-human-reference-pack-test.js
      - run: node frontend/strumenti/fame-neural-composer/phase7c-block1-smoke-test.js
      - run: node frontend/strumenti/fame-neural-composer/phase7c-block2-smoke-test.js
      - run: node frontend/strumenti/fame-neural-composer/phase7d-block1-smoke-test.js
      - run: node frontend/strumenti/fame-neural-composer/phase7d-block2-smoke-test.js
      - run: node frontend/strumenti/fame-neural-composer/phase3-source-registry-smoke-test.js
      - run: node frontend/strumenti/fame-neural-composer/phase7a-block3-smoke-test.js

  audio-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: 'frontend/strumenti/fame-neural-composer/owned-beats/.python-version'
          cache: 'pip'
          cache-dependency-path: 'frontend/strumenti/fame-neural-composer/owned-beats/requirements-audio-analysis-lock.txt'
      - name: Candidate freeze integrity
        run: python frontend/strumenti/fame-neural-composer/owned-beats-candidate-freeze-test.py
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install audio-analysis Python environment
        run: python -m pip install -r frontend/strumenti/fame-neural-composer/owned-beats/requirements-audio-analysis-lock.txt
      - name: Owned beats Audio Analysis V1 baseline smoke
        run: python frontend/strumenti/fame-neural-composer/owned-beats-audio-analysis-test.py
      - name: Audio Analysis V1 evaluator precision-v2 regression
        run: python frontend/strumenti/fame-neural-composer/owned-beats/audio-analysis-v1-evaluate-test.py
      - name: Audio Analysis V1 evaluator precision-v3 regression
        run: python frontend/strumenti/fame-neural-composer/owned-beats/audio-analysis-v1-evaluate-v2-test.py
      - name: Audio Analysis section diagnostics regression
        run: python frontend/strumenti/fame-neural-composer/owned-beats/audio-analysis-section-diagnostics-v1-test.py
      - name: Owned beats Audio Analysis V2 pre-tuning hardening
        run: python frontend/strumenti/fame-neural-composer/owned-beats-audio-analysis-v2-test.py

  human-reference-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/fame-browser" --no-save playwright@1.62.1
          node "$RUNNER_TEMP/fame-browser/node_modules/playwright/cli.js" install --with-deps chromium --only-shell
      - name: Human reference interaction regression
        env:
          NODE_PATH: ${{ runner.temp }}/fame-browser/node_modules
        run: node frontend/strumenti/fame-neural-composer/owned-beats-human-reference-browser-test.js
