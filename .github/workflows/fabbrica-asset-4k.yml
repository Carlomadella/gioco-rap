name: Installa fondale Fabbrica 4K

on:
  push:
    branches:
      - feature/fabbrica-pagina-foto

permissions:
  contents: write

jobs:
  asset:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fabbrica-pagina-foto
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Crea fondale 3840x2160
        env:
          SOURCE_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/75b2aed3-36dc-4289-886c-98d69719fa70.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiODgyOTUxM2QzYTlhYjZkNiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDg5MjM0OX0.SOYfiernjbyrPHbR0GB9ngldsfc4RIJ9Z3gUzs5N1hU"
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          import io, os, urllib.request
          from pathlib import Path
          from PIL import Image, ImageOps

          target = Path("frontend/media/photo/schermate_luoghi/schermate_luoghi_con_elementi_HTML/fabbrica.webp")
          old = Path("frontend/media/photo/schermate_luoghi/schermate_luoghi_con_elementi_HTML/fabbrica.avif")

          with urllib.request.urlopen(os.environ["SOURCE_URL"], timeout=60) as response:
              raw = response.read()
          im = Image.open(io.BytesIO(raw)).convert("RGB")
          im = ImageOps.fit(im, (3840, 2160), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))
          target.parent.mkdir(parents=True, exist_ok=True)
          im.save(target, "WEBP", quality=92, method=6)
          if old.exists():
              old.unlink()

          check = Image.open(target)
          assert check.size == (3840, 2160), check.size
          print(f"{target}: {check.size[0]}x{check.size[1]} - {target.stat().st_size} bytes")
          PY
      - name: Salva asset nella branch
        run: |
          rm -f .github/workflows/fabbrica-asset-4k.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(fabbrica): sostituisce fondale con versione 4K"
          git push origin HEAD:feature/fabbrica-pagina-foto
