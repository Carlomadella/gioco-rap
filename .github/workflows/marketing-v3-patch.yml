name: Patch Marketing V3

on:
  push:
    branches:
      - task/marketing-ciclo-v1-20260916
    paths:
      - .github/workflows/marketing-v3-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/marketing-ciclo-v1-20260916

      - name: Collega V3 con sostituzioni esatte
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: attesa 1 occorrenza, trovate {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'frontend/pagine/gioco.html',
              '<script src="js/game/actions.js?v=17"></script>\n<script src="js/game/events.js?v=12"></script>',
              '<script src="js/game/actions.js?v=17"></script>\n<!-- Marketing V3: dopo ACTIONS, che estende senza riscriverle. -->\n<script src="js/game/marketing-v3.js?v=1"></script>\n<script src="js/game/events.js?v=12"></script>',
              'caricamento marketing-v3'
          )

          replace_once(
              'frontend/js/game/telefono.js',
              '''  const attesaDopo = Math.min(100, attesa + ADF_ANTEPRIMA_SPINTA * 100);\n  const azione = ant ? "anteprima" : "promo";''',
              '''  const attesaDopo = Math.min(100, attesa + ADF_ANTEPRIMA_SPINTA * 100);\n  const camp = typeof marketingTelefonoConfig === "function"\n    ? marketingTelefonoConfig(ant, ultimo)\n    : null;\n  const azione = camp && camp.azione ? camp.azione : (ant ? "anteprima" : "promo");''',
              'config campagna telefono'
          )

          replace_once(
              'frontend/js/game/telefono.js',
              '''      (ant\n        ? 'Il pezzo <b>non è fuori</b>: gliene fai sentire quindici secondi. Ogni anteprima dà hype, ' +\n          'e all\\'uscita parte più forte — ma alla terza l\\'hanno già sentito.'\n        : 'La clip del pezzo che scegli. La prima del giorno rende piena, poi la gente scorre oltre.') +''',
              '''      (camp && camp.intro ? camp.intro :\n        (ant\n          ? 'Il pezzo <b>non è fuori</b>: gliene fai sentire quindici secondi. Ogni anteprima dà hype, ' +\n            'e all\\'uscita parte più forte — ma alla terza l\\'hanno già sentito.'\n          : 'La clip del pezzo che scegli. La prima del giorno rende piena, poi la gente scorre oltre.')) +''',
              'intro campagna telefono'
          )

          replace_once(
              'frontend/js/game/telefono.js',
              '<div class="tnote" style="margin-top:9px"><b>Non ancora fuori</b> · solo anteprima</div>',
              '<div class="tnote" style="margin-top:9px"><b>Non ancora fuori</b> · campagna pre-release</div>',
              'titolo pre-release'
          )

          replace_once(
              'frontend/js/game/telefono.js',
              '''      (ant\n        ? 'anteprime fatte: <b>' + fatte + "/" + ADF_ANTEPRIME_MAX + '</b> · attesa pezzo: <b>' +\n          Math.round(attesa) + '/100</b> · dopo questa: <b>' + Math.round(attesaDopo) + '/100</b> · partenza <b>' +\n          Math.round(100 + attesaDopo) + '%</b>'\n        : ultimo\n          ? 'spingi «<b>' + ultimo.t + '</b>» · ' + (a && a.give ? a.give() : "")\n          : 'Prima esce un pezzo, poi lo si spinge — o gliene fai sentire un\\'anteprima, qui sopra.') +''',
              '''      (camp && camp.stato ? camp.stato :\n        (ant\n          ? 'anteprime fatte: <b>' + fatte + "/" + ADF_ANTEPRIME_MAX + '</b> · attesa pezzo: <b>' +\n            Math.round(attesa) + '/100</b> · dopo questa: <b>' + Math.round(attesaDopo) + '/100</b> · partenza <b>' +\n            Math.round(100 + attesaDopo) + '%</b>'\n          : ultimo\n            ? 'spingi «<b>' + ultimo.t + '</b>» · ' + (a && a.give ? a.give() : "")\n            : 'Prima esce un pezzo, poi lo si spinge — o gliene fai sentire un\\'anteprima, qui sopra.')) +''',
              'stato campagna telefono'
          )

          replace_once(
              'frontend/js/game/telefono.js',
              '      (ant ? "Fai uscire una preview" : "Posta") +',
              '      (camp && camp.bottone ? camp.bottone : (ant ? "Fai uscire una preview" : "Posta")) +',
              'cta campagna telefono'
          )

          # Il workflow serve solo ad applicare questa patch e non resta nel progetto.
          Path('.github/workflows/marketing-v3-patch.yml').unlink()
          PY

      - name: Verifica diff minimo e committa
        shell: bash
        run: |
          node --check frontend/js/game/marketing-v3.js
          node --check frontend/js/game/telefono.js
          git diff --check
          git diff --stat
          git config user.name "Anni di Fame CI"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/js/game/marketing-v3.js frontend/js/game/telefono.js frontend/pagine/gioco.html frontend/test/e2e/marketing-v3.spec.js .github/workflows/marketing-v3-patch.yml
          git commit -m "feat(marketing): collega il ciclo V3 a LaFamegram"
          git push origin HEAD:task/marketing-ciclo-v1-20260916
